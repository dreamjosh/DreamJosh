<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>Dream Josh - Admin Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<style>
/* ... (Aapka saara CSS wesa hi rahega, bas thoda sa Word editor aur Excel ko adjust kiya hai) ... */
:root{
  --bg-color:#eef5ff; --card-bg:#fff; --text-color:#172033;
  --primary-blue:#123c9b; --secondary-blue:#1976d2;
  --success-green:#16a34a; --warning-red:#d62839;
  --border-color:#dce5f0; --shadow-color:rgba(0,0,0,.1);
  --footer-bg:#123c9b; --gold:#ffd700; --text-light:#6c757d;
  --secondary:#1a2332;
}
.dark-mode{
  --bg-color:#0a0e1a; --card-bg:#141428; --text-color:#e8e8e8;
  --text-light:#a0a0b8; --primary-blue:#1a3a8a; --secondary-blue:#2a5ac8;
  --border-color:#2a2a4a; --shadow-color:rgba(0,0,0,.3);
  --footer-bg:#0d1b3e; --secondary:#1a1a2e;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg-color);color:var(--text-color);min-height:100vh;transition:background .3s,color .3s;}

/* LOGIN */
.login-screen{display:none;position:fixed;inset:0;background:var(--bg-color);z-index:99999;align-items:center;justify-content:center;padding:20px;}
.login-screen.active{display:flex;}
.login-box{background:var(--card-bg);border-radius:16px;padding:40px 36px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.15);border:1px solid var(--border-color);}
.login-box .login-logo{text-align:center;margin-bottom:24px;}
.login-box .login-logo h1{font-size:26px;font-weight:800;color:var(--text-color);}
.login-box .login-logo h1 span{color:var(--gold);}
.login-box .login-logo .badge{display:inline-block;background:var(--success-green);color:#fff;font-size:10px;padding:3px 12px;border-radius:20px;font-weight:700;margin-top:6px;}
.login-form-group{margin-bottom:16px;}
.login-form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:6px;}
.login-form-group input{width:100%;padding:12px 14px;border:2px solid var(--border-color);border-radius:10px;font-size:14px;background:var(--bg-color);color:var(--text-color);}
.login-btn{width:100%;padding:14px;background:var(--primary-blue);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}

/* ADMIN LAYOUT */
.admin-wrapper{display:none;min-height:100vh;}
.admin-wrapper.active{display:flex;}
.admin-sidebar{width:280px;background:var(--footer-bg);color:#fff;padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0;}
.admin-logo{padding:0 20px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.admin-logo h1{font-size:20px;font-weight:700;color:#fff;}
.admin-logo h1 span{color:var(--gold);}
.admin-logo .badge{background:var(--success-green);font-size:9px;padding:2px 8px;border-radius:20px;font-weight:600;}
.admin-user{padding:0 20px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px;display:flex;align-items:center;gap:12px;}
.admin-user .avatar{width:36px;height:36px;border-radius:50%;background:var(--secondary-blue);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;}

.admin-menu{list-style:none;padding:0 10px;}
.admin-menu > li{margin-bottom:2px;}
.admin-menu .menu-link{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;color:rgba(255,255,255,.75);text-decoration:none;font-size:13px;font-weight:500;transition:.3s;cursor:pointer;}
.admin-menu .menu-link:hover{background:rgba(255,255,255,.08);color:#fff;}
.admin-menu .menu-link.active{background:rgba(255,215,0,.15);color:var(--gold);}
.admin-menu .submenu{list-style:none;max-height:0;overflow:hidden;transition:max-height .3s ease;opacity:0;padding-left:8px;}
.admin-menu .submenu.open{max-height:2000px;opacity:1;margin-top:2px;margin-bottom:4px;}
.admin-menu .submenu a{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 28px;border-radius:6px;color:rgba(255,255,255,.6);text-decoration:none;font-size:12.5px;font-weight:500;transition:.2s;cursor:pointer;}
.admin-menu .submenu a:hover{background:rgba(255,255,255,.06);color:#fff;}

.admin-content{flex:1;padding:24px 30px;background:var(--bg-color);min-height:100vh;overflow-y:auto;}
.admin-top-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--border-color);flex-wrap:wrap;gap:12px;}
.admin-top-header h2{font-size:20px;font-weight:700;}
.admin-top-header h2 span{color:var(--primary-blue);}
.admin-actions{display:flex;gap:8px;}
.btn-dark-admin, .btn-logout, .btn-close-admin{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-dark-admin{background:var(--secondary);color:#fff;}
.btn-logout{background:#d62839;color:#fff;}
.btn-close-admin{background:#6c757d;color:#fff;}

.admin-card{background:var(--card-bg);border-radius:10px;border:1px solid var(--border-color);box-shadow:0 2px 8px var(--shadow-color);padding:16px 20px;margin-bottom:16px;}
.card-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
.card-header h4{font-size:15px;font-weight:600;}
.btn-add{padding:6px 14px;background:var(--success-green);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}

.admin-section{display:none;margin-top:16px;}
.admin-section.active{display:block;}

/* MODAL */
.admin-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px;}
.admin-modal-overlay.active{display:flex;}
.admin-modal{background:var(--card-bg);border-radius:12px;max-width:98%;width:100%;max-height:96vh;overflow-y:auto;padding:20px 24px;border:1px solid var(--border-color);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border-color);}
.modal-header h3{font-size:18px;font-weight:700;}
.close-modal{font-size:22px;cursor:pointer;background:none;border:none;color:var(--text-color);}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:3px;}
.form-group input, .form-group select, .form-group textarea{width:100%;padding:8px 12px;border:2px solid var(--border-color);border-radius:6px;font-size:13px;background:var(--bg-color);color:var(--text-color);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.btn-submit{padding:8px 20px;background:var(--success-green);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;}
.btn-cancel{padding:8px 20px;background:#6c757d;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;margin-left:8px;}

/* PAGE GRID */
.page-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-top: 12px; }
.page-card { background: var(--card-bg); border-radius: 10px; padding: 16px; border: 1px solid var(--border-color); }
.page-card h4 { font-size: 15px; margin-bottom: 6px; }
.page-card .page-card-meta { font-size: 11px; color: var(--text-light); margin-bottom: 10px; }
.page-card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.btn-i-edit, .btn-i-delete { padding:4px 10px;border-radius:5px;font-size:11px;font-weight:600;border:none;cursor:pointer; }
.btn-i-edit{background:#ffc107;color:#333;}
.btn-i-delete{background:#dc3545;color:#fff;}

.data-item{background:var(--bg-color);border-radius:8px;padding:12px 14px;border:1px solid var(--border-color);margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.item-sno{width:32px;height:32px;border-radius:50%;background:var(--secondary-blue);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.item-content{flex:1;}
.item-title{font-weight:600;font-size:14px;}
.item-meta{font-size:11px;color:var(--text-light);}
.item-actions{display:flex;gap:4px;}

/* WORD EDITOR & EXCEL */
.word-toolbar{background:#fafbfc;border:1px solid #d1d9e6;border-radius:8px 8px 0 0;padding:6px 8px;display:flex;flex-wrap:wrap;gap:2px;position:sticky;top:0;z-index:50;}
.word-toolbar .tb-group{display:flex;gap:1px;padding:0 4px;border-right:1px solid #d1d9e6;align-items:center;}
.word-toolbar .tb-group:last-child{border-right:none;}
.word-toolbar .tb-btn{min-width:28px;height:28px;padding:0 6px;border:1px solid transparent;border-radius:4px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#2c3e50;transition:.15s;gap:4px;}
.word-toolbar .tb-btn:hover{background:#e8f0fe;border-color:#c2d4f0;}
.word-toolbar select{height:28px;border:1px solid #d1d9e6;border-radius:4px;padding:0 4px;font-size:11px;background:#fff;cursor:pointer;color:#2c3e50;}
.word-editor-wrap{background:#e8ecf1;padding:16px;min-height:400px;border:1px solid #d1d9e6;border-top:none;border-radius:0 0 8px 8px;overflow-y:auto;max-height:600px;}
.word-editor-wrap .page{background:#fff;max-width:850px;margin:0 auto;min-height:400px;padding:40px 50px;box-shadow:0 4px 20px rgba(0,0,0,.1);border-radius:2px;color:#1a1a1a;}
#richEditor{min-height:350px;outline:none;font-size:15px;line-height:1.7;}
#richEditor:empty:before{content:'यहाँ content लिखें...';color:#999;font-style:italic;}
#richEditor img{max-width:100%;border-radius:6px;margin:8px 0;}
#richEditor table{border-collapse:collapse;width:100%;margin:10px 0;}
#richEditor table td,#richEditor table th{border:1px solid #999;padding:8px;}

/* EXCEL GRID */
.excel-container{overflow-x:auto;margin:10px 0;border:1px solid #ccc;}
.excel-table{border-collapse:collapse;width:100%;}
.excel-table th, .excel-table td{border:1px solid #ccc;padding:8px;min-width:100px;outline:none;}
.excel-table th{background:#f0f0f0;font-weight:bold;}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:12px;color:#fff;font-size:14px;font-weight:600;z-index:99999;}
.toast.success{background:#16a34a;}
.toast.error{background:#dc3545;}
.toast.info{background:#1976d2;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen active" id="loginScreen">
  <div class="login-box">
    <div class="login-logo"><h1>🚀 <span>Dream</span>Josh</h1><div class="badge">ADMIN PANEL</div></div>
    <div class="login-error" id="loginError" style="display:none; color:red; margin-bottom:10px;">❌ Invalid credentials</div>
    <form onsubmit="handleLogin(event)">
      <div class="login-form-group"><label>Username</label><input type="text" id="loginUsername" value="Admin" required></div>
      <div class="login-form-group"><label>Password</label><input type="password" id="loginPassword" value="Admin@123" required></div>
      <button type="submit" class="login-btn">Login</button>
    </form>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="admin-wrapper" id="adminWrapper">
  <div class="admin-sidebar">
    <div class="admin-logo"><h1>🚀 <span>Dream</span>Josh</h1><span class="badge">Admin</span></div>
    <div class="admin-user"><div class="avatar">A</div><div><div class="name">Administrator</div></div></div>
    <ul class="admin-menu" id="dynamicSidebar"></ul>
    <div style="padding:12px 10px;border-top:1px solid rgba(255,255,255,.08);margin-top:12px;">
      <a class="menu-link" href="/">Back to Home</a>
      <a class="menu-link" onclick="handleLogout()">Logout</a>
    </div>
  </div>

  <div class="admin-content">
    <div class="admin-top-header">
      <h2 id="adminPageTitle">📊 Dashboard</h2>
      <div class="admin-actions">
        <button class="btn-dark-admin" onclick="toggleDarkMode()"><i class="fas fa-moon"></i> Dark</button>
        <a href="/" class="btn-close-admin"><i class="fas fa-times"></i> Close</a>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="adminPage-dashboard" class="admin-section active">
      <div class="admin-card">
        <div class="card-header"><h4>⚡ Quick Actions</h4></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn-add" onclick="showAdminPage('pages')">Pages Manager</button>
        </div>
      </div>
    </div>

    <!-- PAGES MANAGER -->
    <div id="adminPage-pages" class="admin-section">
      <div class="admin-card">
        <div class="card-header">
          <h4>📄 Pages Manager</h4>
          <button class="btn-add" onclick="openPageModal()">Add New Page</button>
        </div>
        <div class="page-grid" id="pagesGrid"></div>
      </div>
    </div>

    <div id="dynamicSectionsContainer"></div>
  </div>
</div>

<!-- MODAL -->
<div class="admin-modal-overlay" id="adminModalOverlay">
  <div class="admin-modal">
    <div class="modal-header"><h3 id="adminModalTitle">Edit</h3><button class="close-modal" onclick="closeAdminModal()">&times;</button></div>
    <div id="adminModalBody"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBlI0IgzkgvoPaTntxfnU8q5CYRwc4sIHM",
  authDomain: "dreamjosh-7d9ee.firebaseapp.com",
  projectId: "dreamjosh-7d9ee",
  storageBucket: "dreamjosh-7d9ee.firebasestorage.app",
  messagingSenderId: "461367857074",
  appId: "1:461367857074:web:6cb1e1ffafaf60309c5eab"
};

let firebaseApp, firebaseDB, firebaseStorage;
try {
  firebaseApp = firebase.initializeApp(firebaseConfig);
  firebaseDB = firebase.firestore();
  firebaseStorage = firebase.storage();
} catch (err) { console.error(err); }

let pagesData = [];
let appData = {};
const PAGES_KEY = 'dreamjosh_pages_data';
const STORAGE_KEY = 'dreamjosh_admin_data';

const DEFAULT_PAGES = [
  { id: 'career', name: 'Career', icon: 'fa-graduation-cap', subPages: [
    { id: 'govt-jobs', name: 'Govt Jobs', icon: 'fa-landmark', parentId: 'career' },
    { id: 'private-jobs', name: 'Private Jobs', icon: 'fa-building', parentId: 'career' }
  ]},
  { id: 'tools', name: 'Tools', icon: 'fa-tools', subPages: [
    { id: 'calculators', name: 'Calculators', icon: 'fa-calculator', parentId: 'tools' }
  ]}
];

function loadData() {
  try {
    const savedPages = localStorage.getItem(PAGES_KEY);
    pagesData = savedPages ? JSON.parse(savedPages) : JSON.parse(JSON.stringify(DEFAULT_PAGES));
    const savedData = localStorage.getItem(STORAGE_KEY);
    if (savedData) appData = JSON.parse(savedData).appData || {};
  } catch(e) { pagesData = JSON.parse(JSON.stringify(DEFAULT_PAGES)); }
}

async function loadFromCloud() {
  if (!firebaseDB) return;
  try {
    const dPages = await firebaseDB.collection('dreamjosh').doc('pagesData').get();
    if (dPages.exists && dPages.data().pages) {
      pagesData = dPages.data().pages;
      localStorage.setItem(PAGES_KEY, JSON.stringify(pagesData));
    }
    const dData = await firebaseDB.collection('dreamjosh').doc('appData').get();
    if (dData.exists) {
      appData = dData.data();
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ appData }));
    }
  } catch(e) {}
}

function savePages() {
  localStorage.setItem(PAGES_KEY, JSON.stringify(pagesData));
  if (firebaseDB) firebaseDB.collection('dreamjosh').doc('pagesData').set({ pages: pagesData }).catch(()=>{});
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ appData }));
  if (firebaseDB) firebaseDB.collection('dreamjosh').doc('appData').set(appData).catch(()=>{});
}

function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('loginUsername').value;
  const p = document.getElementById('loginPassword').value;
  if (u === 'Admin' && p === 'Admin@123') {
    localStorage.setItem('admin_logged', 'true');
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('adminWrapper').classList.add('active');
    initAdmin();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

function handleLogout() {
  localStorage.removeItem('admin_logged');
  document.getElementById('loginScreen').classList.add('active');
  document.getElementById('adminWrapper').classList.remove('active');
}

async function initAdmin() {
  loadData();
  await loadFromCloud();
  renderSidebar();
  renderPagesGrid();
  showAdminPage('dashboard');
}

function renderSidebar() {
  const menu = document.getElementById('dynamicSidebar');
  let html = `
    <li><a class="menu-link" onclick="showAdminPage('dashboard')">Dashboard</a></li>
    <li><a class="menu-link" onclick="showAdminPage('pages')">Pages Manager</a></li>
  `;

  pagesData.forEach(page => {
    const hasSub = page.subPages && page.subPages.length > 0;
    if (hasSub) {
      html += `
        <li>
          <div class="menu-link" onclick="document.getElementById('submenu-${page.id}').classList.toggle('open')" style="justify-content:space-between;">
            <span><i class="fas ${page.icon}"></i> ${page.name}</span>
            <i class="fas fa-chevron-down" style="font-size:10px;"></i>
          </div>
          <ul class="submenu" id="submenu-${page.id}">
            ${page.subPages.map(sub => `<li><a onclick="showAdminPage('${sub.id}')"><i class="fas ${sub.icon}"></i> ${sub.name}</a></li>`).join('')}
            <li><a onclick="openPageModal('${page.id}')" style="color:var(--gold);font-size:11px;"><i class="fas fa-plus"></i> Add Sub-Page</a></li>
          </ul>
        </li>
      `;
    } else {
      html += `<li><a class="menu-link" onclick="showAdminPage('${page.id}')"><i class="fas ${page.icon}"></i> ${page.name}</a></li>`;
    }
  });
  menu.innerHTML = html;
}

function renderPagesGrid() {
  const grid = document.getElementById('pagesGrid');
  let html = '';
  pagesData.forEach(page => {
    const subCount = page.subPages ? page.subPages.length : 0;
    html += `
      <div class="page-card">
        <h4><i class="fas ${page.icon}"></i> ${page.name}</h4>
        <div class="page-card-meta">${subCount} Sub-page(s)</div>
        <div class="page-card-actions">
          <button class="btn-i-edit" onclick="openPageModal('${page.id}')">Edit</button>
          <button class="btn-i-delete" onclick="deletePage('${page.id}')">Delete</button>
        </div>
      </div>
    `;
  });
  grid.innerHTML = html;
}

function openPageModal(parentId = null, subId = null) {
  const isSub = parentId && subId;
  let page = isSub ? pagesData.find(p=>p.id===parentId).subPages.find(s=>s.id===subId) : parentId ? pagesData.find(p=>p.id===parentId) : {name:'',icon:'fa-file'};

  document.getElementById('adminModalTitle').textContent = isSub ? 'Edit Sub-Page' : parentId ? 'Edit Page' : 'Add Page';
  document.getElementById('adminModalBody').innerHTML = `
    <input type="hidden" id="pmParentId" value="${parentId||''}">
    <input type="hidden" id="pmSubId" value="${subId||''}">
    <div class="form-group"><label>Name</label><input type="text" id="pmName" value="${page.name}"></div>
    <div class="form-group"><label>Icon (FontAwesome)</label><input type="text" id="pmIcon" value="${page.icon}"></div>
    ${!parentId ? `
      <div class="form-group">
        <label>Make Sub-Page of:</label>
        <select id="pmParentSelect">
          <option value="">-- Top Level Page --</option>
          ${pagesData.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
        </select>
      </div>
    `:''}
    <button class="btn-submit" onclick="savePage()">Save</button>
    <button class="btn-cancel" onclick="closeAdminModal()">Cancel</button>
  `;
  document.getElementById('adminModalOverlay').classList.add('active');
}

function savePage() {
  const pId = document.getElementById('pmParentId').value;
  const sId = document.getElementById('pmSubId').value;
  const name = document.getElementById('pmName').value;
  const icon = document.getElementById('pmIcon').value;
  const newParent = document.getElementById('pmParentSelect')?.value;

  if(!name) return alert('Name required');

  if(sId) {
    const parent = pagesData.find(p=>p.id===pId);
    const sub = parent.subPages.find(s=>s.id===sId);
    sub.name = name; sub.icon = icon;
  } else if(pId) {
    const page = pagesData.find(p=>p.id===pId);
    page.name = name; page.icon = icon;
  } else {
    const newId = 'page-'+Date.now();
    if(newParent) {
      const parent = pagesData.find(p=>p.id===newParent);
      if(!parent.subPages) parent.subPages = [];
      parent.subPages.push({id:newId, name, icon, parentId:newParent});
    } else {
      pagesData.push({id:newId, name, icon, subPages:[]});
    }
  }
  savePages(); renderSidebar(); renderPagesGrid(); closeAdminModal();
}

function deletePage(id) {
  if(!confirm('Delete Page?')) return;
  pagesData = pagesData.filter(p=>p.id!==id);
  savePages(); renderSidebar(); renderPagesGrid();
}

function showAdminPage(pageId) {
  document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
  const staticPage = document.getElementById('adminPage-'+pageId);
  if(staticPage) { staticPage.classList.add('active'); return; }

  let info = null;
  for(const p of pagesData) {
    if(p.id===pageId) { info = p; break; }
    if(p.subPages) {
      const s = p.subPages.find(sp=>sp.id===pageId);
      if(s) { info = s; break; }
    }
  }

  if(!info) return;
  const sectionId = 'adminPage-'+pageId;
  document.getElementById(sectionId)?.remove();

  const div = document.createElement('div');
  div.id = sectionId;
  div.className = 'admin-section active';
  div.innerHTML = `
    <div class="admin-card">
      <div class="card-header">
        <h4>${info.name} - Content & Items</h4>
        <button class="btn-add primary" onclick="openEditor('${pageId}')">Add/Edit Content</button>
      </div>
      <div style="margin-bottom:15px;">
        <div style="font-size:13px;font-weight:700;margin-bottom:8px;">📝 Page Content:</div>
        <div style="padding:12px;background:var(--bg-color);border-radius:6px;border:1px solid var(--border-color);max-height:200px;overflow-y:auto;">${appData[pageId]?.content || '<em style="color:#999;">No content yet</em>'}</div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div style="font-size:13px;font-weight:700;">📋 Items (${(appData[pageId]?.items||[]).length})</div>
          <button class="btn-add" onclick="openItemModal('${pageId}')">Add Item</button>
        </div>
        <div id="items-${pageId}"></div>
      </div>
    </div>
  `;
  document.getElementById('dynamicSectionsContainer').appendChild(div);
  renderItems(pageId);
}

function renderItems(pageId) {
  const c = document.getElementById('items-'+pageId);
  const items = appData[pageId]?.items || [];
  if(!items.length) { c.innerHTML = 'No items yet.'; return; }
  c.innerHTML = items.map((item, i) => `
    <div class="data-item">
      <div class="item-sno">${i+1}</div>
      <div class="item-content"><div class="item-title">${item.title}</div></div>
      <button class="btn-i-delete" onclick="deleteItem('${pageId}', ${i})">Delete</button>
    </div>
  `).join('');
}

function deleteItem(page, idx) {
  appData[page].items.splice(idx,1); saveData(); renderItems(page);
}

function closeAdminModal() { document.getElementById('adminModalOverlay').classList.remove('active'); }
function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
function showToast(msg, type='info') { const t=document.createElement('div'); t.className='toast '+type; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }

/* ==========================================================
   WORD EDITOR + EXCEL + MEDIA UPLOAD LOGIC
========================================================== */
function getWordEditorHTML(content) {
  return `
    <div class="word-toolbar">
      <div class="tb-group">
        <button type="button" class="tb-btn" onclick="weCmd('bold')"><i class="fas fa-bold"></i></button>
        <button type="button" class="tb-btn" onclick="weCmd('italic')"><i class="fas fa-italic"></i></button>
        <button type="button" class="tb-btn" onclick="weCmd('underline')"><i class="fas fa-underline"></i></button>
      </div>
      <div class="tb-group">
        <select onchange="weFormat(this.value)">
          <option value="p">Normal</option>
          <option value="h1">H1</option><option value="h2">H2</option><option value="h3">H3</option>
        </select>
      </div>
      <div class="tb-group">
        <button type="button" class="tb-btn" onclick="weCmd('insertUnorderedList')"><i class="fas fa-list-ul"></i></button>
        <button type="button" class="tb-btn" onclick="weCmd('insertOrderedList')"><i class="fas fa-list-ol"></i></button>
      </div>
      <div class="tb-group">
        <button type="button" class="tb-btn" onclick="weInsertLink()" title="Insert Link"><i class="fas fa-link"></i></button>
        <button type="button" class="tb-btn" onclick="weInsertExcel()" title="Insert Excel Table"><i class="fas fa-table"></i> Excel</button>
      </div>
      <div class="tb-group">
        <button type="button" class="tb-btn" onclick="triggerUpload('pdf')" title="Upload PDF"><i class="fas fa-file-pdf"></i> PDF</button>
        <button type="button" class="tb-btn" onclick="triggerUpload('image')" title="Upload Image"><i class="fas fa-image"></i> Photo</button>
      </div>
    </div>
    <div class="word-editor-wrap">
      <div class="page">
        <div id="richEditor" contenteditable="true">${content || ''}</div>
      </div>
    </div>
    <input type="file" id="uploadInput" style="display:none;" onchange="handleFileUpload(event)">
  `;
}

function weCmd(cmd, val) { document.execCommand(cmd, false, val || null); document.getElementById('richEditor')?.focus(); }
function weFormat(tag) { document.execCommand('formatBlock', false, tag); document.getElementById('richEditor')?.focus(); }
function weInsertLink() {
  const url = prompt('Link URL:', 'https://');
  if (!url) return;
  document.execCommand('createLink', false, url);
}
function weInsertExcel() {
  const rows = prompt('Excel Rows:', '3'); const cols = prompt('Excel Columns:', '3');
  if(!rows || !cols) return;
  let html = '<div class="excel-container"><table class="excel-table"><tbody>';
  for(let i=0;i<rows;i++){ html+='<tr>'; for(let j=0;j<cols;j++){ html+='<td contenteditable="true">Cell</td>'; } html+='</tr>'; }
  html += '</tbody></table></div><br>';
  document.execCommand('insertHTML', false, html);
}

let currentUploadType = 'image';
let currentSelection = null;
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if(sel.rangeCount > 0 && document.getElementById('richEditor')?.contains(sel.anchorNode)) {
    currentSelection = sel.getRangeAt(0);
  }
});

function triggerUpload(type) {
  currentUploadType = type;
  document.getElementById('uploadInput').accept = type === 'image' ? 'image/*' : '.pdf';
  document.getElementById('uploadInput').click();
}

async function handleFileUpload(e) {
  const file = e.target.files[0];
  if(!file || !firebaseStorage) return;

  showToast('⏳ Uploading...', 'info');

  try {
    const ref = firebaseStorage.ref(`editor/${Date.now()}_${file.name}`);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    
    if (currentSelection) {
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(currentSelection);
    }
    
    if (currentUploadType === 'image') {
      document.execCommand('insertHTML', false, `<div style="text-align:center;"><img src="${url}" style="max-width:100%; border-radius:8px; margin:10px 0;" alt="image"><br><label style="font-size:12px; background:#eef5ff; padding:4px 8px; border-radius:4px; display:inline-block; margin-top:5px;"><input type="checkbox" class="show-on-home-img" value="${url}"> Home Page par dikhaye</label></div><br>`);
    } else {
      document.execCommand('insertHTML', false, `<div style="padding:10px; border:1px solid #ccc; border-radius:6px; background:#f9f9f9; margin:10px 0;"><i class="fas fa-file-pdf" style="color:red; font-size:20px;"></i> <a href="${url}" target="_blank" style="font-weight:bold; text-decoration:none;">View PDF Document</a></div><br>`);
    }
    showToast('✅ Uploaded & Inserted!', 'success');
  } catch (err) {
    showToast('❌ Upload failed: ' + err.message, 'error');
  }
}

function openEditor(pageId) {
  const content = appData[pageId]?.content || '';
  document.getElementById('adminModalTitle').textContent = 'Edit Content';
  document.getElementById('adminModalBody').innerHTML = `
    <input type="hidden" id="editorPageId" value="${pageId}">
    ${getWordEditorHTML(content)}
    <div style="margin-top:15px;">
      <button class="btn-submit" onclick="saveEditorContent()">Save Content</button>
      <button class="btn-cancel" onclick="closeAdminModal()">Cancel</button>
    </div>
  `;
  document.getElementById('adminModalOverlay').classList.add('active');
}

function saveEditorContent() {
  const pageId = document.getElementById('editorPageId').value;
  let content = document.getElementById('richEditor').innerHTML;
  
  const parser = new DOMParser();
  const doc = parser.parseFromString(content, 'text/html');
  const checkedImages = [];
  doc.querySelectorAll('.show-on-home-img:checked').forEach(cb => checkedImages.push(cb.value));
  
  doc.querySelectorAll('label').forEach(l => { if(l.innerHTML.includes('Home Page par dikhaye')) l.remove(); });
  content = doc.body.innerHTML;

  if(!appData[pageId]) appData[pageId] = {items: []};
  appData[pageId].content = content;
  appData[pageId].homeImages = checkedImages; 
  
  saveData();
  showAdminPage(pageId);
  closeAdminModal();
  showToast('✅ Content Saved!', 'success');
}

function openItemModal(pageId) {
  document.getElementById('adminModalTitle').textContent = 'Add Item';
  document.getElementById('adminModalBody').innerHTML = `
    <input type="hidden" id="itemPageId" value="${pageId}">
    <div class="form-group"><label>Title</label><input type="text" id="itemTitle"></div>
    <button class="btn-submit" onclick="saveItem()">Save</button>
    <button class="btn-cancel" onclick="closeAdminModal()">Cancel</button>
  `;
  document.getElementById('adminModalOverlay').classList.add('active');
}

function saveItem() {
  const pageId = document.getElementById('itemPageId').value;
  const title = document.getElementById('itemTitle').value;
  if(!title) return;
  if(!appData[pageId]) appData[pageId] = {items: []};
  if(!appData[pageId].items) appData[pageId].items = [];
  appData[pageId].items.push({title});
  saveData(); showAdminPage(pageId); closeAdminModal();
}

document.addEventListener('DOMContentLoaded', () => {
  if(localStorage.getItem('admin_logged') === 'true') {
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('adminWrapper').classList.add('active');
    initAdmin();
  }
});
</script>
