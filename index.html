<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>Dream Josh - Study & Govt. Jobs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ================= CSS VARIABLES ================= */
        :root {
            --bg-color: #eef5ff;
            --card-bg: #ffffff;
            --text-color: #172033;
            --primary-blue: #123c9b;
            --secondary-blue: #1976d2;
            --success-green: #16a34a;
            --warning-red: #d62839;
            --highlight-bg: #eefaf4;
            --border-color: #dce5f0;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --header-bg: linear-gradient(135deg, #123c9b, #1976d2);
            --footer-bg: #123c9b;
            --card-hover: #f4f8ff;
            --gold: #ffd700;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --text-light: #6c757d;
            --secondary: #1a2332;
            --private-color: #6c5ce7;
            --central-color: #1976d2;
            --state-color: #16a34a;
            --public-badge: #16a34a;
            --private-badge: #6c5ce7;
            --editor-bg: #f8f9fa;
            --editor-toolbar-bg: #ffffff;
            --editor-border: #d1d5db;
        }

        .dark-mode {
            --bg-color: #0a0e1a;
            --card-bg: #141428;
            --text-color: #e8e8e8;
            --text-light: #a0a0b8;
            --primary-blue: #1a3a8a;
            --secondary-blue: #2a5ac8;
            --border-color: #2a2a4a;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --footer-bg: #0d1b3e;
            --card-hover: #1a1a3a;
            --gold: #ffd700;
            --secondary: #1a1a2e;
            --private-color: #8c7cf5;
            --central-color: #4a8ad4;
            --state-color: #3aad5a;
            --editor-bg: #1a1a2e;
            --editor-toolbar-bg: #141428;
            --editor-border: #2a2a4a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
            padding-top: 70px;
            padding-bottom: 70px;
        }

        /* ================= HEADER ================= */
        .app-header {
            background: var(--header-bg);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 60px;
            box-shadow: 0 2px 20px var(--shadow-color);
            padding-top: calc(10px + var(--safe-top));
        }
        .app-header .logo {
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            user-select: none;
        }
        .app-header .logo span { color: var(--gold); }
        .app-header .header-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .app-header .header-controls .nav-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 5px 12px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: 0.3s;
            white-space: nowrap;
            text-decoration: none;
        }
        .app-header .header-controls .nav-btn:hover {
            background: var(--gold);
            color: #0a0e1a;
        }
        .app-header .header-controls .nav-btn.active {
            background: var(--gold);
            color: #0a0e1a;
        }
        .app-header .header-controls .admin-btn {
            background: #dc3545;
            border-color: #dc3545;
        }
        .app-header .header-controls .admin-btn:hover {
            background: #ff4757;
            color: #fff;
        }

        /* ================= DROPDOWN ================= */
        .dropdown-wrapper {
            position: relative;
            display: inline-block;
        }
        .dropdown-wrapper .dropdown-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 5px 12px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: 0.3s;
            white-space: nowrap;
        }
        .dropdown-wrapper .dropdown-btn:hover {
            background: var(--gold);
            color: #0a0e1a;
        }
        .dropdown-wrapper .dropdown-btn .arrow {
            font-size: 10px;
            margin-left: 3px;
        }
        .dropdown-wrapper:hover .dropdown-content,
        .dropdown-wrapper .dropdown-content.show {
            display: block;
            animation: dropdownFade 0.25s ease;
        }
        .dropdown-wrapper .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 30px var(--shadow-color);
            min-width: 260px;
            z-index: 1001;
            padding: 6px 0;
            max-height: 70vh;
            overflow-y: auto;
        }
        @keyframes dropdownFade {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .dropdown-wrapper .dropdown-content button {
            display: block;
            width: 100%;
            padding: 10px 20px;
            background: transparent;
            border: none;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: 0.2s;
        }
        .dropdown-wrapper .dropdown-content button:hover {
            background: var(--card-hover);
        }
        .dropdown-wrapper .dropdown-content .dropdown-divider {
            height: 1px;
            background: var(--border-color);
            margin: 4px 12px;
        }
        .dropdown-wrapper .dropdown-content .dropdown-label {
            padding: 8px 20px;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-color);
            opacity: 0.4;
            font-weight: 700;
        }
        .dropdown-wrapper .dropdown-content .dropdown-item-icon {
            margin-right: 8px;
        }

        /* ================= FOOTER ================= */
        .app-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: var(--footer-bg);
            padding: 8px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 55px;
            box-shadow: 0 -2px 15px var(--shadow-color);
            padding-bottom: calc(8px + var(--safe-bottom));
            gap: 8px;
            flex-wrap: wrap;
        }
        .app-footer .footer-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            text-align: center;
        }
        .app-footer .footer-text span { color: var(--gold); }
        .app-footer .footer-nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .app-footer .footer-nav .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            padding: 4px 10px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: 0.3s;
            white-space: nowrap;
            text-decoration: none;
        }
        .app-footer .footer-nav .nav-btn:hover {
            background: rgba(255, 215, 0, 0.3);
            color: #fff;
            border-color: var(--gold);
        }
        .app-footer .footer-nav .nav-btn.active {
            background: var(--gold);
            color: #0a0e1a;
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 768px) {
            .app-header { padding: 8px 12px; height: 55px; }
            .app-header .logo { font-size: 16px; }
            .app-header .header-controls .nav-btn,
            .app-header .header-controls .dropdown-btn { font-size: 10px; padding: 4px 8px; }
            .app-footer { height: 50px; padding: 6px 10px; }
            .app-footer .footer-text { font-size: 10px; }
            .app-footer .footer-nav .nav-btn { font-size: 9px; padding: 3px 8px; }
            body { padding-top: 60px; padding-bottom: 55px; }
            .dropdown-wrapper .dropdown-content {
                position: fixed;
                top: 55px;
                left: 0;
                right: 0;
                border-radius: 0 0 16px 16px;
                max-height: 60vh;
                min-width: 100%;
            }
            .dropdown-wrapper:hover .dropdown-content { display: none; }
            .dropdown-wrapper .dropdown-content.show { display: block !important; }
        }
        @media (max-width: 480px) {
            .app-header .logo { font-size: 14px; }
            .app-header .header-controls .nav-btn,
            .app-header .header-controls .dropdown-btn { font-size: 9px; padding: 3px 6px; border-radius: 12px; }
            .app-footer .footer-nav .nav-btn { font-size: 8px; padding: 2px 6px; }
        }

        /* ================= SECTION CONTAINER ================= */
        .section-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px;
        }
        .section {
            display: none;
            padding: 20px 0 30px 0;
            animation: fadeInSection 0.4s ease;
        }
        .section.active { display: block; }
        @keyframes fadeInSection {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .section .section-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-color);
        }
        .section .section-header h2 span { color: var(--primary-blue); }

        /* ================= HOME PAGE ================= */
        .home-original {
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 16px;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .home-original header {
            background: var(--header-bg);
            color: white;
            text-align: center;
            padding: 30px 20px;
            border-radius: 16px 16px 0 0;
        }
        .home-original header h1 { margin: 0; font-size: 36px; }
        .home-original header p { margin: 5px 0 0; font-size: 16px; }
        .home-original header small { font-size: 13px; opacity: 0.8; }
        .home-original .ticker {
            margin: 8px auto;
            max-width: 1100px;
            padding: 8px 10px;
            border-radius: 8px;
            color: white;
            overflow: hidden;
            white-space: nowrap;
        }
        .home-original .latest { background: #d62839; }
        .home-original .update { background: #079455; }
        .home-original .ticker span {
            display: inline-block;
            padding-left: 100%;
            animation: move 18s linear infinite;
        }
        @keyframes move {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }
        .home-original .container {
            max-width: 1100px;
            margin: auto;
            padding: 16px 12px;
        }
        .home-original .home-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }
        .home-original .left-content { flex: 3; }
        .home-original .right-sidebar { flex: 1; }
        .home-original .sidebar-box {
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 2px 8px var(--shadow-color);
            margin-bottom: 16px;
            overflow: hidden;
            transition: background 0.3s ease;
        }
        .home-original .sidebar-box h3 {
            margin: 0;
            padding: 10px 14px;
            background: var(--secondary-blue);
            color: #fff;
            font-size: 14px;
        }
        .home-original .notice {
            max-height: 220px;
            overflow-y: auto;
        }
        .home-original .notice ul {
            padding: 8px 20px;
            list-style: none;
        }
        .home-original .notice ul li {
            padding: 6px 0;
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
        }
        .home-original .notice ul li:last-child { border-bottom: none; }
        .home-original .imp-links a {
            display: block;
            padding: 8px 14px;
            border-bottom: 1px solid var(--border-color);
            color: var(--primary-blue);
            text-decoration: none;
            transition: 0.3s;
            font-size: 13px;
            cursor: pointer;
        }
        .home-original .imp-links a:hover { background: var(--card-hover); }
        .home-original .card {
            background: var(--card-bg);
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            border-left: 5px solid var(--secondary-blue);
            transition: background 0.3s ease;
        }
        .home-original .card h3 {
            margin-top: 0;
            color: var(--primary-blue);
            font-size: 18px;
        }
        .home-original .about-home {
            line-height: 1.8;
            font-size: 15px;
        }
        .home-original .about-home h3 { margin-top: 14px; margin-bottom: 6px; }
        .home-original .about-home ul {
            padding-left: 20px;
            margin: 6px 0 12px;
        }
        .home-original .about-home li {
            margin: 4px 0;
            font-size: 14px;
        }
        .home-original .about-highlight {
            margin-top: 14px;
            padding: 16px;
            border-left: 4px solid var(--success-green);
            background: var(--highlight-bg);
            border-radius: 8px;
            text-align: center;
            font-size: 17px;
        }
        @media (max-width: 768px) {
            .home-original .home-layout { flex-direction: column; }
            .home-original .left-content,
            .home-original .right-sidebar { width: 100%; }
            .home-original header h1 { font-size: 26px; }
            .home-original .container { padding: 10px 8px; }
            .home-original .card { padding: 14px; }
            .home-original .about-home { font-size: 14px; }
            .section .section-header h2 { font-size: 22px; }
            .section-container { padding: 12px 14px; }
        }

        /* ================= JOB SECTION ================= */
        .job-grid-wrapper {
            margin: 20px 0;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px var(--shadow-color);
            animation: fadeInSection 0.4s ease;
        }
        .job-grid-wrapper .jobs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .job-grid-wrapper .jobs-header h3 {
            font-size: 20px;
            color: var(--primary-blue);
        }
        .job-grid-wrapper .jobs-header h3 span { color: var(--gold); }
        .job-grid-wrapper .jobs-header .total-badge {
            background: var(--secondary-blue);
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .job-info-box {
            background: var(--bg-color);
            border-radius: 10px;
            padding: 12px 16px;
            margin: 8px 0 16px 0;
            border-left: 4px solid var(--secondary-blue);
        }
        .job-info-box .job-count {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-blue);
        }
        .job-info-box .job-detail {
            font-size: 12px;
            color: var(--text-color);
            opacity: 0.7;
            margin-top: 3px;
        }
        .job-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
            margin-top: 10px;
        }
        .job-card {
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            transition: 0.3s;
            cursor: pointer;
            box-shadow: 0 2px 6px var(--shadow-color);
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .job-card:hover {
            border-color: var(--secondary-blue);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px var(--shadow-color);
        }
        .job-card .job-icon { font-size: 28px; margin-bottom: 6px; }
        .job-card .job-title { font-size: 14px; color: var(--primary-blue); font-weight: 700; }
        .job-card .job-meta { font-size: 11px; color: var(--text-color); opacity: 0.7; }
        .job-card .job-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 600;
            color: #fff;
            margin-top: 4px;
            align-self: flex-start;
        }
        .job-card .job-badge.central { background: var(--central-color); }
        .job-card .job-badge.state { background: var(--state-color); }
        .job-card .job-badge.private { background: var(--private-color); }
        .sub-cat-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0 12px 0;
        }
        .sub-cat-filter .sub-btn {
            padding: 4px 12px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .sub-cat-filter .sub-btn:hover,
        .sub-cat-filter .sub-btn.active {
            background: var(--secondary-blue);
            color: #fff;
            border-color: var(--secondary-blue);
        }

        /* ================= DETAIL OVERLAY =
