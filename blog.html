<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>Dream Josh - Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-color: #eef5ff; --card-bg: #ffffff; --text-color: #172033;
            --primary-blue: #123c9b; --secondary-blue: #1976d2;
            --success-green: #16a34a; --warning-red: #d62839;
            --highlight-bg: #eefaf4; --border-color: #dce5f0;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --header-bg: linear-gradient(135deg, #123c9b, #1976d2);
            --footer-bg: #123c9b; --card-hover: #f4f8ff; --gold: #ffd700;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --text-light: #6c757d; --secondary: #1a2332;
            --editor-toolbar-bg: #ffffff;
        }
        .dark-mode {
            --bg-color: #0a0e1a; --card-bg: #141428; --text-color: #e8e8e8;
            --text-light: #a0a0b8; --primary-blue: #1a3a8a;
            --secondary-blue: #2a5ac8; --border-color: #2a2a4a;
            --shadow-color: rgba(0, 0, 0, 0.3); --footer-bg: #0d1b3e;
            --card-hover: #1a1a3a; --secondary: #1a1a2e;
            --editor-toolbar-bg: #141428;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg-color); color: var(--text-color);
            min-height: 100vh; transition: background 0.3s ease, color 0.3s ease;
            padding-top: 70px; padding-bottom: 70px;
        }

        /* HEADER */
        .app-header {
            background: var(--header-bg); padding: 10px 16px;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            height: 60px; box-shadow: 0 2px 20px var(--shadow-color);
            padding-top: calc(10px + var(--safe-top));
        }
        .app-header .logo {
            font-size: 20px; font-weight: bold; cursor: pointer;
            color: #fff; user-select: none;
            display: flex; align-items: center; gap: 8px;
        }
        .app-header .logo span { color: var(--gold); }
        .app-header .header-controls {
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        }
        .app-header .header-controls .nav-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff; padding: 5px 12px; border-radius: 18px;
            cursor: pointer; font-size: 12px; font-weight: 600;
            transition: 0.3s; white-space: nowrap;
        }
        .app-header .header-controls .nav-btn:hover { background: var(--gold); color: #0a0e1a; }
        .app-header .header-controls .nav-btn.active { background: var(--gold); color: #0a0e1a; }

        /* DROPDOWN */
        .dropdown-wrapper { position: relative; display: inline-block; }
        .dropdown-wrapper .dropdown-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff; padding: 5px 12px; border-radius: 18px;
            cursor: pointer; font-size: 12px; font-weight: 600;
            transition: 0.3s; white-space: nowrap;
        }
        .dropdown-wrapper .dropdown-btn:hover { background: var(--gold); color: #0a0e1a; }
        .dropdown-wrapper .dropdown-btn.active { background: var(--gold); color: #0a0e1a; }
        .dropdown-wrapper .dropdown-btn .arrow { font-size: 10px; margin-left: 3px; }
        .dropdown-wrapper:hover .dropdown-content,
        .dropdown-wrapper .dropdown-content.show { display: block; animation: dropdownFade 0.25s ease; }
        .dropdown-wrapper .dropdown-content {
            display: none; position: absolute; top: 100%; left: 0;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; box-shadow: 0 8px 30px var(--shadow-color);
            min-width: 260px; z-index: 1001; padding: 6px 0;
            max-height: 70vh; overflow-y: auto;
        }
        @keyframes dropdownFade {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .dropdown-wrapper .dropdown-content button {
            display: block; width: 100%; padding: 10px 20px;
            background: transparent; border: none; text-align: left;
            font-size: 13px; font-weight: 600; color: var(--text-color);
            cursor: pointer; transition: 0.2s;
        }
        .dropdown-wrapper .dropdown-content button:hover { background: var(--card-hover); }
        .dropdown-wrapper .dropdown-content .dropdown-label {
            padding: 8px 20px; font-size: 11px; text-transform: uppercase;
            color: var(--text-color); opacity: 0.4; font-weight: 700;
        }
        .dropdown-wrapper .dropdown-content .dropdown-item-icon { margin-right: 8px; }

        /* FOOTER */
        .app-footer {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 999;
            background: var(--footer-bg); padding: 8px 16px;
            display: flex; justify-content: center; align-items: center;
            height: 55px; box-shadow: 0 -2px 15px var(--shadow-color);
            padding-bottom: calc(8px + var(--safe-bottom));
            gap: 8px; flex-wrap: wrap;
        }
        .app-footer .footer-text {
            color: rgba(255, 255, 255, 0.7); font-size: 12px; text-align: center;
        }
        .app-footer .footer-text span { color: var(--gold); }
        .app-footer .footer-nav {
            display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
        }
        .app-footer .footer-nav .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            padding: 4px 10px; border-radius: 14px;
            cursor: pointer; font-size: 11px; font-weight: 500;
            transition: 0.3s; white-space: nowrap;
        }
        .app-footer .footer-nav .nav-btn:hover {
            background: rgba(255, 215, 0, 0.3); color: #fff;
            border-color: var(--gold);
        }
        .app-footer .footer-nav .nav-btn.active {
            background: var(--gold); color: #0a0e1a;
        }

        /* MAIN */
        .section-container { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }
        .section { display: block; padding: 20px 0 30px 0; animation: fadeInSection 0.4s ease; }
        @keyframes fadeInSection {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .section .section-header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
        }
        .section .section-header h2 {
            font-size: 28px; font-weight: 700; color: var(--text-color);
        }
        .section .section-header h2 span { color: var(--primary-blue); }

        .page-ticker {
            margin: 8px auto 16px auto; max-width: 1100px;
            padding: 8px 10px; border-radius: 8px; color: white;
            overflow: hidden; white-space: nowrap;
            background: var(--secondary-blue);
        }
        .page-ticker span {
            display: inline-block; padding-left: 100%;
            animation: move 18s linear infinite;
        }
        @keyframes move {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }

        /* PAGE CONTENT */
        .page-content-display {
            background: var(--card-bg); border-radius: 12px; padding: 24px;
            border: 1px solid var(--border-color); margin-top: 16px;
            line-height: 1.8; font-size: 15px;
        }
        .page-content-display h2 { color: var(--primary-blue); margin-bottom: 12px; }
        .page-content-display img { max-width: 100%; height: auto; }
        .page-content-display table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        .page-content-display table td,
        .page-content-display table th {
            border: 1px solid var(--border-color); padding: 8px 12px;
        }
        .page-content-display table th { background: var(--editor-toolbar-bg); font-weight: 600; }
        .page-content-display ul, .page-content-display ol { padding-left: 24px; }
        .page-content-display blockquote {
            border-left: 4px solid var(--secondary-blue);
            padding: 8px 16px; margin: 10px 0;
            background: var(--editor-toolbar-bg); border-radius: 0 4px 4px 0;
        }
        .page-content-display pre {
            background: var(--editor-toolbar-bg); padding: 12px;
            border-radius: 4px; overflow-x: auto;
            border: 1px solid var(--border-color);
        }

        .sub-cat-filter {
            display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px 0;
        }
        .sub-cat-filter .sub-btn {
            padding: 4px 12px; border-radius: 14px;
            border: 1px solid var(--border-color);
            background: var(--bg-color); color: var(--text-color);
            font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .sub-cat-filter .sub-btn:hover,
        .sub-cat-filter .sub-btn.active {
            background: var(--secondary-blue); color: #fff;
            border-color: var(--secondary-blue);
        }

        /* TOAST */
        .toast {
            position: fixed; bottom: 80px; left: 50%;
            transform: translateX(-50%); padding: 12px 24px;
            border-radius: 12px; color: white; font-size: 14px;
            font-weight: 600; z-index: 9999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            max-width: 90%; text-align: center;
        }
        .toast.success { background: #16a34a; }
        .toast.error { background: #dc3545; }
        .toast.info { background: #1976d2; }

        @media (max-width: 768px) {
            .section .section-header h2 { font-size: 22px; }
            .section-container { padding: 12px 14px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <div class="logo" onclick="window.location.href='index.html'">
            🚀 <span>Dream</span>Josh
        </div>
        <div class="header-controls" id="dynamicNav"></div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="section-container">
        <section class="section" id="blog">
            <div class="page-ticker" id="blogTicker"><span id="blogTickerText">📝 Blog • Technology • Business • Design • Lifestyle • Education • News • Portfolio</span></div>
            <div class="section-header">
                <h2>📝 <span>Blog</span></h2>
                <div id="blogSubFilter" class="sub-cat-filter" style="margin:0;gap:8px;">
                    <button class="sub-btn active" data-sub="all" onclick="filterGenericCategory('blog', 'all')">📌 All</button>
                </div>
            </div>
            <div id="blogContent" class="page-content-display"></div>
        </section>
    </div>

    <!-- FOOTER -->
    <footer class="app-footer">
        <div class="footer-nav" id="footerNav"></div>
        <div class="footer-text">© 2026 <span>Dream Josh</span> • Firebase Powered</div>
    </footer>

    <script>
        // ============================================================
        // 🔥 FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBlI0IgzkgvoPaTntxfnU8q5CYRwc4sIHM",
            authDomain: "dreamjosh-7d9ee.firebaseapp.com",
            projectId: "dreamjosh-7d9ee",
            storageBucket: "dreamjosh-7d9ee.firebasestorage.app",
            messagingSenderId: "461367857074",
            appId: "1:461367857074:web:6cb1e1ffafaf60309c5eab",
            measurementId: "G-28W2EBTMQ8"
        };

        let firebaseApp, firebaseAuth, firebaseDB, firebaseStorage;

        try {
            firebaseApp = firebase.initializeApp(firebaseConfig);
            firebaseAuth = firebase.auth();
            firebaseDB = firebase.firestore();
            firebaseStorage = firebase.storage();
            console.log("✅ Firebase initialized");
        } catch (err) {
            console.error("❌ Firebase error:", err);
        }

        // ============================================================
        // 📦 DATA - Blog Page Only
        // ============================================================
        const DEFAULT_DATA = {
            blog: {
                content: '<h2>📝 Blog</h2><p>Read our latest blog posts on various topics.</p>',
                items: [
                    { id: 'bl1', title: '💻 Technology', description: 'Latest tech news and updates', visibility: 'public', category: 'Technology' },
                    { id: 'bl2', title: '📊 Business', description: 'Business and finance articles', visibility: 'public', category: 'Business' },
                    { id: 'bl3', title: '❤️ Lifestyle', description: 'Lifestyle and wellness tips', visibility: 'public', category: 'Lifestyle' }
                ]
            },
            home: {
                pageTaglines: {
                    blog: '📝 Blog • Technology • Business • Design • Lifestyle • Education • News • Portfolio'
                }
            },
            customPages: [
                { id: 'blog', label: 'Blog', icon: 'fa-blog', visible: true, public: true }
            ],
            dropdownMenus: {
                blog: { label: '📝 Blog', items: [
                    { label: '📚 All Blog Posts', action: 'all' },
                    { label: '💻 Technology', action: 'Technology' },
                    { label: '📊 Business', action: 'Business' },
                    { label: '🎨 Design', action: 'Design' },
                    { label: '❤️ Lifestyle', action: 'Lifestyle' },
                    { label: '📚 Education', action: 'Education' },
                    { label: '📰 News', action: 'News' },
                    { label: '💼 Portfolio', action: 'Portfolio' }
                ]}
            }
        };

        // ============================================================
        // STATE
        // ============================================================
        let appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
        const genericFilters = { blog: 'all' };

        // ============================================================
        // RENDER NAV (Home + Blog Dropdown)
        // ============================================================
        function renderNav() {
            const nav = document.getElementById('dynamicNav');
            const blogMenu = appData.dropdownMenus.blog;

            let html = `<button class="nav-btn" onclick="window.location.href='index.html'">🏠 Home</button>`;

            html += `
                <div class="dropdown-wrapper" id="blogDropdown">
                    <button class="dropdown-btn active" onclick="toggleDropdownMobile('blog', event)">${blogMenu.label} <span class="arrow">▾</span></button>
                    <div class="dropdown-content" id="blogDropdownContent">
                        <div class="dropdown-label">📂 ${blogMenu.label}</div>
                        ${blogMenu.items.map(item => `
                            <button onclick="handleDropdownAction('blog', '${item.action}'); closeDropdownMobile('blog');">
                                <i class="fas fa-th-list dropdown-item-icon"></i> ${item.label}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;

            nav.innerHTML = html;
        }

        function renderFooterNav() {
            const footer = document.getElementById('footerNav');
            footer.innerHTML = `
                <button class="nav-btn" onclick="window.location.href='index.html'">🏠 Home</button>
                <button class="nav-btn active" onclick="window.location.href='blog.html'">📝 Blog</button>
            `;
        }

        // ============================================================
        // DROPDOWN ACTIONS
        // ============================================================
        function handleDropdownAction(key, action) {
            if (key === 'blog') {
                filterGenericCategory('blog', action);
            }
        }

        function toggleDropdownMobile(name, event) {
            if (event) event.stopPropagation();
            if (window.innerWidth <= 768) {
                const content = document.getElementById(`${name}DropdownContent`);
                if (content) content.classList.toggle('show');
            }
        }

        function closeDropdownMobile(name) {
            const content = document.getElementById(`${name}DropdownContent`);
            if (content) content.classList.remove('show');
        }

        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 768) {
                if (!e.target.closest('.dropdown-wrapper')) {
                    closeDropdownMobile('blog');
                }
            }
        });

        // ============================================================
        // BLOG PAGE RENDER
        // ============================================================
        function renderGenericPage(page) {
            const container = document.getElementById(`${page}Content`);
            if (!container) return;
            const items = (appData[page]?.items || []).filter(i => i.visibility !== 'private');
            updateGenericSubFilter(page, items);

            let filtered = items;
            const currentCat = genericFilters[page];
            if (currentCat !== 'all') {
                filtered = items.filter(i => i.category === currentCat);
            }

            let html = appData[page]?.content || '';
            if (filtered.length > 0) {
                html += `<div style="margin-top:20px;border-top:2px solid var(--border-color);padding-top:16px;">
                    <h3 style="color:var(--primary-blue);margin-bottom:10px;">📂 Category: ${currentCat === 'all' ? 'All' : currentCat}</h3>
                    <ul style="list-style:none;padding:0;">`;
                filtered.forEach(item => {
                    html += `<li style="padding:8px 12px;background:var(--bg-color);border-radius:6px;margin-bottom:6px;border-left:3px solid var(--secondary-blue);">
                        <strong>${item.title || 'Untitled'}</strong>
                        ${item.description ? `<div style="font-size:13px;color:var(--text-light);margin-top:2px;">${item.description}</div>` : ''}
                    </li>`;
                });
                html += `</ul></div>`;
            } else {
                html += `<p style="color:var(--text-light);margin-top:16px;">No items available in this category yet.</p>`;
            }
            container.innerHTML = html;
        }

        function updateGenericSubFilter(page, items) {
            const container = document.getElementById(`${page}SubFilter`);
            if (!container) return;
            let categories = ['all'];
            items.forEach(i => {
                if (i.category && !categories.includes(i.category)) categories.push(i.category);
            });
            container.innerHTML = categories.map(cat =>
                `<button class="sub-btn ${cat === genericFilters[page] ? 'active' : ''}" data-sub="${cat}" onclick="filterGenericCategory('${page}', '${cat}')">${cat === 'all' ? '📌 All' : cat}</button>`
            ).join('');
        }

        function filterGenericCategory(page, category) {
            genericFilters[page] = category;
            renderGenericPage(page);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, type = 'info') {
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        // ============================================================
        // UPDATE TICKER
        // ============================================================
        function updatePageTaglines() {
            const taglines = appData.home?.pageTaglines || DEFAULT_DATA.home.pageTaglines;
            const ticker = document.getElementById('blogTickerText');
            if (ticker) ticker.textContent = taglines.blog || '📝 Blog • Technology • Business • Design • Lifestyle • Education • News • Portfolio';
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            renderNav();
            renderFooterNav();
            updatePageTaglines();
            renderGenericPage('blog');
            console.log('✅ Dream Josh - Blog Page Ready');
        });

        // Expose globally
        window.filterGenericCategory = filterGenericCategory;
        window.showToast = showToast;
        window.handleDropdownAction = handleDropdownAction;
        window.toggleDropdownMobile = toggleDropdownMobile;
        window.closeDropdownMobile = closeDropdownMobile;
    </script>

</body>
</html>
