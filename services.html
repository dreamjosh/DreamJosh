<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>Services – Dream Josh</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- 🔥 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-color: #eef5ff; --card-bg: #ffffff; --text-color: #172033;
            --primary-blue: #123c9b; --secondary-blue: #1976d2;
            --success-green: #16a34a; --warning-red: #d62839;
            --highlight-bg: #eefaf4; --border-color: #dce5f0;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --header-bg: linear-gradient(135deg, #123c9b, #1976d2);
            --footer-bg: #123c9b; --card-hover: #f4f8ff; --gold: #ffd700;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --text-light: #6c757d; --secondary: #1a2332;
            --editor-toolbar-bg: #ffffff;
        }
        .dark-mode {
            --bg-color: #0a0e1a; --card-bg: #141428; --text-color: #e8e8e8;
            --text-light: #a0a0b8; --primary-blue: #1a3a8a;
            --secondary-blue: #2a5ac8; --border-color: #2a2a4a;
            --shadow-color: rgba(0, 0, 0, 0.3); --footer-bg: #0d1b3e;
            --card-hover: #1a1a3a; --secondary: #1a1a2e;
            --editor-toolbar-bg: #141428;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg-color); color: var(--text-color);
            min-height: 100vh; transition: background 0.3s ease, color 0.3s ease;
            padding-top: 70px; padding-bottom: 40px;
        }

        /* HEADER */
        .app-header {
            background: var(--header-bg); padding: 10px 16px;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            height: 60px; box-shadow: 0 2px 20px var(--shadow-color);
            padding-top: calc(10px + var(--safe-top));
        }
        .app-header .logo {
            font-size: 20px; font-weight: bold; cursor: pointer;
            color: #fff; user-select: none;
            display: flex; align-items: center; gap: 8px;
            text-decoration: none;
        }
        .app-header .logo span { color: var(--gold); }
        .app-header .header-controls {
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        }
        .app-header .header-controls .nav-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff; padding: 5px 12px; border-radius: 18px;
            cursor: pointer; font-size: 12px; font-weight: 600;
            transition: 0.3s; white-space: nowrap;
            text-decoration: none;
            display: inline-flex; align-items: center;
        }
        .app-header .header-controls .nav-btn:hover { background: var(--gold); color: #0a0e1a; }
        .app-header .header-controls .nav-btn.active { background: var(--gold); color: #0a0e1a; }

        .app-header .header-controls .nav-btn.admin-btn {
            background: rgba(214, 40, 57, 0.85);
            border-color: rgba(214, 40, 57, 1);
        }
        .app-header .header-controls .nav-btn.admin-btn:hover {
            background: #d62839; color: #fff;
        }

        /* DROPDOWN */
        .dropdown-wrapper { position: relative; display: inline-block; }
        .dropdown-wrapper .dropdown-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff; padding: 5px 12px; border-radius: 18px;
            cursor: pointer; font-size: 12px; font-weight: 600;
            transition: 0.3s; white-space: nowrap;
        }
        .dropdown-wrapper .dropdown-btn:hover { background: var(--gold); color: #0a0e1a; }
        .dropdown-wrapper .dropdown-btn.active { background: var(--gold); color: #0a0e1a; }
        .dropdown-wrapper .dropdown-btn .arrow { font-size: 10px; margin-left: 3px; }
        .dropdown-wrapper:hover .dropdown-content,
        .dropdown-wrapper .dropdown-content.show { display: block; animation: dropdownFade 0.25s ease; }
        .dropdown-wrapper .dropdown-content {
            display: none; position: absolute; top: 100%; left: 0;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; box-shadow: 0 8px 30px var(--shadow-color);
            min-width: 260px; z-index: 1001; padding: 6px 0;
            max-height: 70vh; overflow-y: auto;
        }
        @keyframes dropdownFade {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .dropdown-wrapper .dropdown-content button,
        .dropdown-wrapper .dropdown-content a {
            display: block; width: 100%; padding: 10px 20px;
            background: transparent; border: none; text-align: left;
            font-size: 13px; font-weight: 600; color: var(--text-color);
            cursor: pointer; transition: 0.2s;
            text-decoration: none;
        }
        .dropdown-wrapper .dropdown-content button:hover,
        .dropdown-wrapper .dropdown-content a:hover { background: var(--card-hover); }
        .dropdown-wrapper .dropdown-content .dropdown-label {
            padding: 8px 20px; font-size: 11px; text-transform: uppercase;
            color: var(--text-color); opacity: 0.4; font-weight: 700;
        }
        .dropdown-wrapper .dropdown-content .dropdown-item-icon { margin-right: 8px; }

        /* CONTAINER */
        .section-container { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }
        .section { padding: 10px 0 30px 0; animation: fadeInSection 0.4s ease; }
        @keyframes fadeInSection {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* TICKER */
        .page-ticker {
            margin: 8px auto 16px auto; max-width: 1100px;
            padding: 8px 10px; border-radius: 8px; color: white;
            overflow: hidden; white-space: nowrap;
            background: var(--secondary-blue);
        }
        .page-ticker span {
            display: inline-block; padding-left: 100%;
            animation: move 18s linear infinite;
        }
        @keyframes move {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }

        /* SECTION HEADER */
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
        }
        .section-header h2 {
            font-size: 28px; font-weight: 700; color: var(--text-color);
        }
        .section-header h2 span { color: var(--primary-blue); }

        /* SUB CATEGORY FILTER */
        .sub-cat-filter {
            display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px 0;
        }
        .sub-cat-filter .sub-btn {
            padding: 4px 12px; border-radius: 14px;
            border: 1px solid var(--border-color);
            background: var(--bg-color); color: var(--text-color);
            font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .sub-cat-filter .sub-btn:hover,
        .sub-cat-filter .sub-btn.active {
            background: var(--secondary-blue); color: #fff;
            border-color: var(--secondary-blue);
        }

        /* PAGE CONTENT */
        .page-content-display {
            background: var(--card-bg); border-radius: 12px; padding: 24px;
            border: 1px solid var(--border-color); margin-top: 16px;
            line-height: 1.8; font-size: 15px;
        }
        .page-content-display h2 { color: var(--primary-blue); margin-bottom: 12px; }
        .page-content-display img { max-width: 100%; height: auto; }
        .page-content-display table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        .page-content-display table td,
        .page-content-display table th {
            border: 1px solid var(--border-color); padding: 8px 12px;
        }
        .page-content-display table th { background: var(--editor-toolbar-bg); font-weight: 600; }
        .page-content-display ul, .page-content-display ol { padding-left: 24px; }
        .page-content-display blockquote {
            border-left: 4px solid var(--secondary-blue);
            padding: 8px 16px; margin: 10px 0;
            background: var(--editor-toolbar-bg); border-radius: 0 4px 4px 0;
        }
        .page-content-display pre {
            background: var(--editor-toolbar-bg); padding: 12px;
            border-radius: 4px; overflow-x: auto;
            border: 1px solid var(--border-color);
        }

        /* SERVICE ITEMS */
        .service-items-list {
            margin-top: 20px;
            border-top: 2px solid var(--border-color);
            padding-top: 16px;
        }
        .service-items-list h3 {
            color: var(--primary-blue);
            margin-bottom: 10px;
            font-size: 18px;
        }
        .service-items-list ul {
            list-style: none;
            padding: 0;
        }
        .service-items-list li {
            padding: 12px 14px;
            background: var(--bg-color);
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid var(--secondary-blue);
        }
        .service-items-list li .item-head {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .service-items-list li .item-title {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-color);
        }
        .service-items-list li .item-cat {
            font-size: 10px;
            color: #fff;
            padding: 1px 10px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }
        .service-items-list li .item-cat.government { background: #16a34a; }
        .service-items-list li .item-cat.private { background: #6c5ce7; }
        .service-items-list li .item-cat.education { background: #1976d2; }
        .service-items-list li .item-desc {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 4px;
        }
        .service-items-list li .item-link {
            display: inline-block;
            padding: 2px 10px;
            background: var(--secondary-blue);
            color: #fff;
            border-radius: 4px;
            font-size: 10px;
            text-decoration: none;
            margin-left: 8px;
            font-weight: 600;
        }
        .service-items-list li .item-link:hover { background: var(--primary-blue); }

        /* FOOTER */
        .app-footer {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 999;
            background: var(--footer-bg); padding: 8px 16px;
            display: flex; justify-content: center; align-items: center;
            height: 55px; box-shadow: 0 -2px 15px var(--shadow-color);
            padding-bottom: calc(8px + var(--safe-bottom));
            gap: 8px; flex-wrap: wrap;
        }
        .app-footer .footer-text {
            color: rgba(255, 255, 255, 0.7); font-size: 12px; text-align: center;
        }
        .app-footer .footer-text span { color: var(--gold); }
        .app-footer .footer-nav {
            display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
        }
        .app-footer .footer-nav a {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            padding: 4px 10px; border-radius: 14px;
            cursor: pointer; font-size: 11px; font-weight: 500;
            transition: 0.3s; white-space: nowrap;
            text-decoration: none;
        }
        .app-footer .footer-nav a:hover {
            background: rgba(255, 215, 0, 0.3); color: #fff;
            border-color: var(--gold);
        }
        .app-footer .footer-nav a.active {
            background: var(--gold); color: #0a0e1a;
        }

        /* TOAST */
        .toast {
            position: fixed; bottom: 80px; left: 50%;
            transform: translateX(-50%); padding: 12px 24px;
            border-radius: 12px; color: white; font-size: 14px;
            font-weight: 600; z-index: 9999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            max-width: 90%; text-align: center;
            transition: opacity 0.3s ease;
        }
        .toast.success { background: #16a34a; }
        .toast.error { background: #dc3545; }
        .toast.info { background: #1976d2; }

        @media (max-width: 768px) {
            .section .section-header h2 { font-size: 22px; }
            .section-container { padding: 12px 14px; }
            .app-header .header-controls .nav-btn { font-size: 10px; padding: 4px 8px; }
            .dropdown-wrapper .dropdown-btn { font-size: 10px; padding: 4px 8px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <a href="index.html" class="logo">
            🚀 <span>Dream</span>Josh
        </a>
        <div class="header-controls" id="dynamicNav"></div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="section-container">
        <section class="section active" id="service">
            <div class="page-ticker" id="serviceTicker">
                <span id="serviceTickerText">🛠️ Services • Government • Private • Education</span>
            </div>
            <div class="section-header">
                <h2>🛠️ <span>Services</span></h2>
                <div id="serviceSubFilter" class="sub-cat-filter" style="margin:0;gap:8px;">
                    <button class="sub-btn active" data-sub="all" onclick="filterServiceCategory('all')">📌 All</button>
                    <button class="sub-btn" data-sub="government" onclick="filterServiceCategory('government')">🏛️ Government</button>
                    <button class="sub-btn" data-sub="private" onclick="filterServiceCategory('private')">💼 Private</button>
                    <button class="sub-btn" data-sub="education" onclick="filterServiceCategory('education')">📚 Education</button>
                </div>
            </div>
            <div id="serviceContent" class="page-content-display"></div>
        </section>
    </div>

    <!-- FOOTER -->
    <footer class="app-footer">
        <div class="footer-nav" id="footerNav">
            <a href="index.html">🏠 Home</a>
            <a href="jobs.html">💼 Jobs</a>
            <a href="career.html">🎯 Career</a>
            <a href="more.html">📚 More</a>
            <a href="services.html" class="active">🛠️ Services</a>
            <a href="blog.html">📝 Blog</a>
            <a href="rsr.html">📜 RSR</a>
            <a href="tools.html">🛠️ Tools</a>
            <a href="admin.html" style="background:rgba(214,40,57,0.85);">🔐 Admin</a>
        </div>
        <div class="footer-text">© 2026 <span>Dream Josh</span> • Services Page</div>
    </footer>

    <script>
        // ============================================================
        // 🔥 FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBlI0IgzkgvoPaTntxfnU8q5CYRwc4sIHM",
            authDomain: "dreamjosh-7d9ee.firebaseapp.com",
            projectId: "dreamjosh-7d9ee",
            storageBucket: "dreamjosh-7d9ee.firebasestorage.app",
            messagingSenderId: "461367857074",
            appId: "1:461367857074:web:6cb1e1ffafaf60309c5eab"
        };

        let firebaseApp, firebaseDB, firebaseStorage;
        try {
            firebaseApp = firebase.initializeApp(firebaseConfig);
            firebaseDB = firebase.firestore();
            firebaseStorage = firebase.storage();
            console.log("✅ Firebase connected");
        } catch (err) {
            console.error("❌ Firebase error:", err);
        }

        // ============================================================
        // 📦 DEFAULT DATA (fallback)
        // ============================================================
        const DEFAULT_SERVICE_DATA = {
            service: {
                content: `
                    <h2>🛠️ Services</h2>
                    <p>Welcome to Dream Josh Services. Find all types of services here with direct links.</p>
                    <p>नीचे दी गई सेवाओं में से अपनी आवश्यकता के अनुसार चुनें और सीधे लिंक पर जाएँ।</p>
                `,
                items: [
                    { id: 'sv1', title: '📝 Resume Writing Service', description: 'Professional resume writing for all career levels.', visibility: 'public', category: 'private', link: 'https://dreamjosh.com/resume' },
                    { id: 'sv2', title: '🏛️ Passport Services', description: 'Complete passport assistance and verification.', visibility: 'public', category: 'government', link: 'https://passport.gov.in' },
                    { id: 'sv3', title: '📚 Online Tutoring', description: 'One-on-one tutoring for competitive exams.', visibility: 'public', category: 'education', link: 'https://dreamjosh.com/tutoring' },
                    { id: 'sv4', title: '💼 Career Counseling', description: 'Expert career guidance and counseling services.', visibility: 'public', category: 'private', link: 'https://dreamjosh.com/counseling' },
                    { id: 'sv5', title: '🪪 Aadhar Services', description: 'Aadhar card update and enrollment assistance.', visibility: 'public', category: 'government', link: 'https://uidai.gov.in' },
                    { id: 'sv6', title: '🎯 Mock Test Series', description: 'Online mock tests for all competitive exams.', visibility: 'public', category: 'education', link: 'https://dreamjosh.com/tests' },
                    { id: 'sv7', title: '📄 Document Verification', description: 'Document attestation and verification services.', visibility: 'public', category: 'government', link: 'https://dreamjosh.com/verify' },
                    { id: 'sv8', title: '💻 IT Services', description: 'Web development and digital marketing services.', visibility: 'public', category: 'private', link: 'https://dreamjosh.com/it' },
                    { id: 'sv9', title: '🎓 Scholarship Assistance', description: 'Help with scholarship applications and guidance.', visibility: 'public', category: 'education', link: 'https://dreamjosh.com/scholarship' },
                    { id: 'sv10', title: '🏦 Banking Services', description: 'Bank account opening and financial services.', visibility: 'public', category: 'private', link: 'https://dreamjosh.com/banking' }
                ]
            }
        };

        // ============================================================
        // STATE
        // ============================================================
        let appData = JSON.parse(JSON.stringify(DEFAULT_SERVICE_DATA));
        let currentServiceFilter = 'all';

        // ============================================================
        // 🔥 FIREBASE DATA LOADER
        // ============================================================
        async function loadServicesFromFirebase() {
            if (!firebaseDB) { console.warn("⚠️ Firebase not ready"); return; }
            try {
                const doc = await firebaseDB.collection('dreamjosh').doc('appData').get();
                if (doc.exists) {
                    const data = doc.data() || {};
                    if (data.service && (data.service.content || (data.service.items && data.service.items.length))) {
                        appData.service = data.service;
                        console.log(`✅ Services loaded from Firebase: ${(data.service.items || []).length} items`);
                    } else {
                        console.log("ℹ️ No service data in Firebase — using default");
                    }
                } else {
                    console.log("ℹ️ appData doc not found — using default");
                }
            } catch (err) {
                console.error("❌ Services load error:", err);
            }
        }

        async function loadSettingsFromFirebase() {
            if (!firebaseDB) return;
            try {
                const doc = await firebaseDB.collection('dreamjosh').doc('settings').get();
                if (doc.exists) {
                    const settings = doc.data();
                    if (settings.siteName) document.title = settings.siteName + ' – Services';
                    console.log("✅ Settings loaded");
                }
            } catch (err) {
                console.error("❌ Settings load error:", err);
            }
        }

        // ============================================================
        // RENDER NAV — Full navigation
        // ============================================================
        function renderNav() {
            const nav = document.getElementById('dynamicNav');

            let html = `<a href="index.html" class="nav-btn">🏠 Home</a>`;

            // 💼 Jobs dropdown
            html += `
                <div class="dropdown-wrapper" id="govtDropdown">
                    <button class="dropdown-btn" onclick="toggleDropdownMobile('govt', event)">💼 Jobs <span class="arrow">▾</span></button>
                    <div class="dropdown-content" id="govtDropdownContent">
                        <div class="dropdown-label">📂 Select Category</div>
                        <a href="jobs.html?cat=central" onclick="closeDropdownMobile('govt');">🏛️ Central Govt.</a>
                        <a href="jobs.html?cat=state" onclick="closeDropdownMobile('govt');">🏜️ Rajasthan Govt.</a>
                        <a href="jobs.html?cat=private" onclick="closeDropdownMobile('govt');">💼 Private</a>
                        <a href="jobs.html" onclick="closeDropdownMobile('govt');">📋 All Jobs</a>
                    </div>
                </div>
            `;

            // 🎯 Career dropdown
            html += `
                <div class="dropdown-wrapper" id="careerDropdown">
                    <button class="dropdown-btn" onclick="toggleDropdownMobile('career', event)">🎯 Career <span class="arrow">▾</span></button>
                    <div class="dropdown-content" id="careerDropdownContent">
                        <div class="dropdown-label">📂 Career</div>
                        <a href="career.html" onclick="closeDropdownMobile('career');">
                            <i class="fas fa-th-list dropdown-item-icon"></i> 📋 Open All
                        </a>
                    </div>
                </div>
            `;

            // ⚙️ More dropdown
            html += `
                <div class="dropdown-wrapper" id="moreDropdown">
                    <button class="dropdown-btn" onclick="toggleDropdownMobile('more', event)">⚙️ More <span class="arrow">▾</span></button>
                    <div class="dropdown-content" id="moreDropdownContent">
                        <div class="dropdown-label">📂 More</div>
                        <a href="more.html" onclick="closeDropdownMobile('more');">
                            <i class="fas fa-th-list dropdown-item-icon"></i> 📋 Open All
                        </a>
                    </div>
                </div>
            `;

            // 🛠️ Services dropdown (active)
            html += `
                <div class="dropdown-wrapper" id="serviceDropdown">
                    <button class="dropdown-btn active" onclick="toggleDropdownMobile('service', event)">
                        🛠️ Services <span class="arrow">▾</span>
                    </button>
                    <div class="dropdown-content" id="serviceDropdownContent">
                        <div class="dropdown-label">📂 Select Service Type</div>
                        <button onclick="handleDropdownAction('service', 'all'); closeDropdownMobile('service');">
                            <i class="fas fa-th-list dropdown-item-icon"></i> 📋 All Services
                        </button>
                        <button onclick="handleDropdownAction('service', 'government'); closeDropdownMobile('service');">
                            <i class="fas fa-th-list dropdown-item-icon"></i> 🏛️ Government
                        </button>
                        <button onclick="handleDropdownAction('service', 'private'); closeDropdownMobile('service');">
                            <i class="fas fa-th-list dropdown-item-icon"></i> 💼 Private
                        </button>
                        <button onclick="handleDropdownAction('service', 'education'); closeDropdownMobile('service');">
                            <i class="fas fa-th-list dropdown-item-icon"></i> 📚 Education
                        </button>
                    </div>
                </div>
            `;

            // 📝 Blog dropdown
            html += `
                <div class="dropdown-wrapper" id="blogDropdown">
                    <button class="dropdown-btn" onclick="toggleDropdownMobile('blog', event)">📝 Blog <span class="arrow">▾</span></button>
                    <div class="dropdown-content" id="blogDropdownContent">
                        <div class="dropdown-label">📂 Blog</div>
                        <a href="blog.html" onclick="closeDropdownMobile('blog');">
                            <i class="fas fa-th-list dropdown-item-icon"></i> 📋 Open All
                        </a>
                    </div>
                </div>
            `;

            // 📜 RSR dropdown
            html += `
                <div class="dropdown-wrapper" id="rsrDropdown">
                    <button class="dropdown-btn" onclick="toggleDropdownMobile('rsr', event)">📜 RSR <span class="arrow">▾</span></button>
                    <div class="dropdown-content" id="rsrDropdownContent">
                        <div class="dropdown-label">📂 RSR</div>
                        <a href="rsr.html" onclick="closeDropdownMobile('rsr');">
                            <i class="fas fa-gavel dropdown-item-icon"></i> 📜 All Rules
                        </a>
                    </div>
                </div>
            `;

            // 🛠️ Tools
            html += `<a href="tools.html" class="nav-btn">🛠️ Tools</a>`;

            // 🔐 Admin
            html += `<a href="admin.html" class="nav-btn admin-btn">🔐 Admin</a>`;

            nav.innerHTML = html;
        }

        function handleDropdownAction(key, action) {
            if (key === 'service') {
                filterServiceCategory(action);
            }
        }

        function toggleDropdownMobile(name, event) {
            if (event) event.stopPropagation();
            const allDropdowns = ['govt', 'career', 'more', 'service', 'blog', 'rsr'];
            allDropdowns.forEach(d => { if (d !== name) closeDropdownMobile(d); });
            const content = document.getElementById(`${name}DropdownContent`);
            if (content) content.classList.toggle('show');
        }

        function closeDropdownMobile(name) {
            const content = document.getElementById(`${name}DropdownContent`);
            if (content) content.classList.remove('show');
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.dropdown-wrapper')) {
                ['govt', 'career', 'more', 'service', 'blog', 'rsr'].forEach(name => closeDropdownMobile(name));
            }
        });

        // ============================================================
        // RENDER SERVICE PAGE
        // ============================================================
        function renderServicePage(category = 'all') {
            const container = document.getElementById('serviceContent');
            const items = (appData.service?.items || []).filter(i => i.visibility !== 'private');

            document.querySelectorAll('#serviceSubFilter .sub-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.sub === category);
            });

            let filtered = items;
            if (category !== 'all') {
                filtered = items.filter(i => i.category === category);
            }

            let html = appData.service?.content || '';

            if (filtered.length > 0) {
                const catLabel = category === 'all' ? 'All Services' : category.charAt(0).toUpperCase() + category.slice(1) + ' Services';
                html += `<div class="service-items-list">
                    <h3>📂 ${catLabel}</h3>
                    <ul>`;
                filtered.forEach(item => {
                    const linkHtml = item.link ?
                        `<a href="${item.link}" target="_blank" class="item-link"><i class="fas fa-external-link-alt"></i> Visit</a>` : '';
                    html += `<li>
                        <div class="item-head">
                            <span class="item-title">${item.title || 'Untitled'}</span>
                            ${item.category ? `<span class="item-cat ${item.category}">${item.category}</span>` : ''}
                            ${linkHtml}
                        </div>
                        ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
                    </li>`;
                });
                html += `</ul></div>`;
            } else {
                html += `<p style="color:var(--text-light);margin-top:16px;">No services available in this category yet.</p>`;
            }

            container.innerHTML = html;
        }

        function filterServiceCategory(category) {
            currentServiceFilter = category;
            renderServicePage(category);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, type = 'info') {
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2500);
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', async () => {
            // 🔥 Pehle Firebase se data load karo
            await loadServicesFromFirebase();
            await loadSettingsFromFirebase();

            // Phir render karo
            renderNav();
            renderServicePage('all');
            console.log('✅ Services page ready — Firebase connected');
        });

        // Expose globally
        window.filterServiceCategory = filterServiceCategory;
        window.handleDropdownAction = handleDropdownAction;
        window.toggleDropdownMobile = toggleDropdownMobile;
        window.closeDropdownMobile = closeDropdownMobile;
        window.showToast = showToast;
    </script>

</body>
</html>
