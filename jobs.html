            display: flex; align-items: center; gap: 8px;
            text-decoration: none;

        .app-header .logo span { color: var(--gold); }
        .app-header .header-controls {

            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff; padding: 5px 12px; border-radius: 18px;
            cursor: pointer; font-size: 12px; font-weight: 600;
            transition: 0.3s; white-space: nowrap;
            text-decoration: none;
            display: inline-flex; align-items: center;
        }
        .app-header .header-controls .nav-btn:hover { background: var(--gold); color: #0a0e1a; }
        .app-header .header-controls .nav-btn.active { background: var(--gold); color: #0a0e1a; }

        .app-header .header-controls .nav-btn.admin-btn {
            background: rgba(214, 40, 57, 0.85);
            border-color: rgba(214, 40, 57, 1);
        }
        .app-header .header-controls .nav-btn.admin-btn:hover {
            background: #d62839; color: #fff;
        }

        /* DROPDOWN */

        .dropdown-wrapper .dropdown-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff; padding: 5px 12px; border-radius: 18px;
            cursor: pointer; font-size: 12px; font-weight: 600;
            transition: 0.3s; white-space: nowrap;
        }
        .dropdown-wrapper .dropdown-btn:hover { background: var(--gold); color: #0a0e1a; }
        .dropdown-wrapper .dropdown-btn.active { background: var(--gold); color: #0a0e1a; }
        .dropdown-wrapper .dropdown-btn .arrow { font-size: 10px; margin-left: 3px; }
        .dropdown-wrapper:hover .dropdown-content,
        .dropdown-wrapper .dropdown-content.show { display: block; animation: dropdownFade 0.25s ease; }
        .dropdown-wrapper .dropdown-content {
            display: none; position: absolute; top: 100%; left: 0;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; box-shadow: 0 8px 30px var(--shadow-color);
            min-width: 260px; z-index: 1001; padding: 6px 0;
            max-height: 70vh; overflow-y: auto;
        }
        @keyframes dropdownFade {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .dropdown-wrapper .dropdown-content button,
        .dropdown-wrapper .dropdown-content a {
            display: block; width: 100%; padding: 10px 20px;
            background: transparent; border: none; text-align: left;
            font-size: 13px; font-weight: 600; color: var(--text-color);
            cursor: pointer; transition: 0.2s;
            text-decoration: none;
        }
        .dropdown-wrapper .dropdown-content button:hover,
        .dropdown-wrapper .dropdown-content a:hover { background: var(--card-hover); }
        .dropdown-wrapper .dropdown-content .dropdown-label {
            padding: 8px 20px; font-size: 11px; text-transform: uppercase;
            color: var(--text-color); opacity: 0.4; font-weight: 700;
        }
        .dropdown-wrapper .dropdown-content .dropdown-item-icon { margin-right: 8px; }

        .job-grid {

        .job-card {

        .job-card:hover {

        .job-card .job-title { font-size: 14px; color: var(--primary-blue); font-weight: 700; }
        .job-card .job-meta { font-size: 11px; color: var(--text-color); opacity: 0.7; }
        .job-card .job-badge {

        .detail-content .detail-link:hover { background: var(--primary-blue); }

        /* TOAST */
        .toast {
            position: fixed; bottom: 80px; left: 50%;
            transform: translateX(-50%); padding: 12px 24px;
            border-radius: 12px; color: white; font-size: 14px;
            font-weight: 600; z-index: 9999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            max-width: 90%; text-align: center;
        }
        .toast.success { background: #16a34a; }
        .toast.error { background: #dc3545; }
        .toast.info { background: #1976d2; }

        @media (max-width: 768px) {
            .section-container { padding: 12px 14px; }
            .job-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
            .app-header .header-controls .nav-btn { font-size: 10px; padding: 4px 8px; }

    </style>

        let currentSubCategory = 'all';

        // ============================================================
        // RENDER NAV — Full navigation
        // ============================================================
        function renderNav() {
            const nav = document.getElementById('dynamicNav');
            let html = `<a href="index.html" class="nav-btn">🏠 Home</a>`;

            // 💼 Jobs dropdown (active)
            html += `
                <div class="dropdown-wrapper" id="govtDropdown">
                    <button class="dropdown-btn active" onclick="toggleDropdownMobile('govt', event)">💼 Jobs <span class="arrow">▾</span></button>
                    <div class="dropdown-content" id="govtDropdownContent">
                        <div class="dropdown-label">📂 Select Category</div>
                        <button onclick="showJobsCategory('central'); closeDropdownMobile('govt');">
                            🏛️ Central Govt. <span style="background:var(--secondary-blue);color:#fff;padding:1px 10px;border-radius:12px;font-size:9px;margin-left:8px;" id="centralCount">0</span>
                        </button>
                        <button onclick="showJobsCategory('state'); closeDropdownMobile('govt');">
                            🏜️ Rajasthan Govt. <span style="background:var(--secondary-blue);color:#fff;padding:1px 10px;border-radius:12px;font-size:9px;margin-left:8px;" id="stateCount">0</span>
                        </button>
                        <button onclick="showJobsCategory('private'); closeDropdownMobile('govt');">
                            💼 Private <span style="background:var(--secondary-blue);color:#fff;padding:1px 10px;border-radius:12px;font-size:9px;margin-left:8px;" id="privateCount">0</span>
                        </button>
                    </div>
                </div>
            `;

            // 🎯 Career dropdown
            html += `
                <div class="dropdown-wrapper" id="careerDropdown">
                    <button class="dropdown-btn" onclick="toggleDropdownMobile('career', event)">🎯 Career <span class="arrow">▾</span></button>
                    <div class="dropdown-content" id="careerDropdownContent">
                        <div class="dropdown-label">📂 Career</div>
                        <a href="career.html" onclick="closeDropdownMobile('career');">
                            <i class="fas fa-th-list dropdown-item-icon"></i> 📋 Open All
                        </a>
                    </div>
                </div>
            `;

            // ⚙️ More dropdown
            html += `
                <div class="dropdown-wrapper" id="moreDropdown">
                    <button class="dropdown-btn" onclick="toggleDropdownMobile('more', event)">⚙️ More <span class="arrow">▾</span></button>
                    <div class="dropdown-content" id="moreDropdownContent">
                        <div class="dropdown-label">📂 More</div>
                        <a href="more.html" onclick="closeDropdownMobile('more');">
                            <i class="fas fa-th-list dropdown-item-icon"></i> 📋 Open All
                        </a>
                    </div>
                </div>
            `;

            // 🛠️ Services dropdown
            html += `
                <div class="dropdown-wrapper" id="serviceDropdown">
                    <button class="dropdown-btn" onclick="toggleDropdownMobile('service', event)">🛠️ Services <span class="arrow">▾</span></button>
                    <div class="dropdown-content" id="serviceDropdownContent">
                        <div class="dropdown-label">📂 Services</div>
                        <a href="services.html" onclick="closeDropdownMobile('service');">
                            <i class="fas fa-th-list dropdown-item-icon"></i> 📋 Open All
                        </a>
                    </div>
                </div>
            `;

            // 📝 Blog dropdown
            html += `
                <div class="dropdown-wrapper" id="blogDropdown">
                    <button class="dropdown-btn" onclick="toggleDropdownMobile('blog', event)">📝 Blog <span class="arrow">▾</span></button>
                    <div class="dropdown-content" id="blogDropdownContent">
                        <div class="dropdown-label">📂 Blog</div>
                        <a href="blog.html" onclick="closeDropdownMobile('blog');">
                            <i class="fas fa-th-list dropdown-item-icon"></i> 📋 Open All
                        </a>
                    </div>
                </div>
            `;

            // 📜 RSR dropdown
            html += `
                <div class="dropdown-wrapper" id="rsrDropdown">
                    <button class="dropdown-btn" onclick="toggleDropdownMobile('rsr', event)">📜 RSR <span class="arrow">▾</span></button>
                    <div class="dropdown-content" id="rsrDropdownContent">
                        <div class="dropdown-label">📂 RSR</div>
                        <a href="rsr.html" onclick="closeDropdownMobile('rsr');">
                            <i class="fas fa-gavel dropdown-item-icon"></i> 📜 All Rules
                        </a>
                    </div>
                </div>
            `;

            // 🛠️ Tools
            html += `<a href="tools.html" class="nav-btn">🛠️ Tools</a>`;

            // 🔐 Admin
            html += `<a href="admin.html" class="nav-btn admin-btn">🔐 Admin</a>`;

            nav.innerHTML = html;
            updateJobCounts();
        }

        function toggleDropdownMobile(name, event) {
            if (event) event.stopPropagation();
            const allDropdowns = ['govt', 'career', 'more', 'service', 'blog', 'rsr'];
            allDropdowns.forEach(d => { if (d !== name) closeDropdownMobile(d); });
            const content = document.getElementById(`${name}DropdownContent`);
            if (content) content.classList.toggle('show');
        }

        function closeDropdownMobile(name) {
            const content = document.getElementById(`${name}DropdownContent`);
            if (content) content.classList.remove('show');
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.dropdown-wrapper')) {
                ['govt', 'career', 'more', 'service', 'blog', 'rsr'].forEach(name => closeDropdownMobile(name));
            }
        });

        function updateJobCounts() {
            const publicJobs = jobsData.filter(j => j.visibility !== 'private');
            const centralEl = document.getElementById('centralCount');
            const stateEl = document.getElementById('stateCount');
            const privateEl = document.getElementById('privateCount');
            if (centralEl) centralEl.textContent = publicJobs.filter(j => j.jobType === 'central').length;
            if (stateEl) stateEl.textContent = publicJobs.filter(j => j.jobType === 'state').length;
            if (privateEl) privateEl.textContent = publicJobs.filter(j => j.jobType === 'private').length;
        }

        // ============================================================
        // JOBS
        // ============================================================
        function showJobsCategory(category) {
            selectCategory(category);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectCategory(category) {
            currentCategory = category;
            currentSubCategory = 'all';
            updateJobsUI();
        }

        function filterSubCategory(sub) {
            currentSubCategory = sub;
            updateJobsUI();
        }

        function updateJobsUI() {
            const publicJobs = jobsData.filter(j => j.visibility !== 'private');
            let filtered = publicJobs.filter(j => j.jobType === currentCategory);
            if (currentSubCategory !== 'all') {
                const subDisplay = SUB_CATEGORIES[currentCategory].find(s => s.toLowerCase() === currentSubCategory);
                if (subDisplay && subDisplay !== 'All') {
                    filtered = filtered.filter(j => j.subCat === subDisplay);
                }
            }
            const info = CATEGORY_INFO[currentCategory];
            const totalJobs = publicJobs.filter(j => j.jobType === currentCategory).length;

            updateJobCounts();

            const lbl = document.getElementById('selectedCategoryLabel');
            if (lbl) lbl.textContent = info.label;
            const jc = document.getElementById('jobCount');
            if (jc) jc.textContent = filtered.length;
            const tb = document.getElementById('totalJobsBadge');
            if (tb) tb.textContent = `Total: ${totalJobs}`;
            const jcd = document.getElementById('jobCountDisplay');
            if (jcd) jcd.innerHTML = info.icon + ' ' + info.label + ' Jobs: <span id="jobCount">' + filtered.length + '</span>';
            const jdd = document.getElementById('jobDetailDisplay');
            if (jdd) jdd.textContent = info.detail;
            renderJobs(filtered);

            const subContainer = document.getElementById('subCategoryFilter');
            if (subContainer) {
                const subs = SUB_CATEGORIES[currentCategory] || ['All'];
                subContainer.innerHTML = subs.map(s =>
                    `<button class="sub-btn ${(s === 'All' && currentSubCategory === 'all') || s.toLowerCase() === currentSubCategory ? 'active' : ''}" onclick="filterSubCategory('${s.toLowerCase()}')">${s === 'All' ? '📌 All' : s}</button>`
                ).join('');
            }
        }

        function renderJobs(jobs) {
            const grid = document.getElementById('jobsGrid');
            if (!grid) return;
            grid.innerHTML = '';
            if (jobs.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text-light);font-size:14px;">No jobs available in this category</div>`;
                return;
            }
            const iconMap = { central: '🏛️', state: '🏜️', private: '💼' };
            const subColorMap = {
                'Administrative': '#4a6cf7', 'Banking': '#f7b731', 'Railway': '#e74c3c',
                'Defence': '#2ecc71', 'Teaching': '#9b59b6', 'Medical': '#e67e22',
                'PSU': '#1abc9c', 'Police': '#2c3e50', 'Revenue': '#27ae60',
                'Forest': '#27ae60', 'Technical': '#3498db', 'Judicial': '#8e44ad',
                'IT/Software': '#6c5ce7', 'Finance': '#00b894', 'Marketing': '#fd79a8',
                'HR': '#0984e3', 'Manufacturing': '#fdcb6e', 'Healthcare': '#e17055',
                'Education': '#6c5ce7', 'Hospitality': '#00cec9', 'Other': '#636e72'
            };
            jobs.forEach((job) => {
                const card = document.createElement('div');
                card.className = 'job-card';
                const subColor = subColorMap[job.subCat] || '#636e72';
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = job.description || '';
                const plainDesc = tempDiv.textContent || tempDiv.innerText || '';
                const shortDesc = plainDesc.length > 60 ? plainDesc.substring(0, 60) + '...' : plainDesc;
                card.innerHTML = `
                    <div class="job-icon">${iconMap[job.jobType] || '📌'}</div>
                    <div class="job-title">${job.title || 'Untitled'}</div>
                    <div class="job-meta">${job.department || ''} | ${job.post || ''}</div>
                    <div class="job-meta" style="font-size:10px;opacity:0.5;">${job.eligibility || ''}</div>
                    <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;">
                        <span style="background:${subColor};color:#fff;padding:1px 8px;border-radius:10px;font-size:9px;font-weight:600;">${job.subCat || 'Other'}</span>
                        <span class="job-badge ${job.jobType}" style="background:${job.jobType === 'central' ? '#1976d2' : job.jobType === 'state' ? '#16a34a' : '#6c5ce7'};color:#fff;padding:1px 8px;border-radius:10px;font-size:9px;">${job.lastDate || 'Open'}</span>
                    </div>
                    ${shortDesc ? `<div style="font-size:10px;color:var(--text-light);margin-top:4px;opacity:0.7;">${shortDesc}</div>` : ''}
                `;
                const idx = jobsData.indexOf(job);
                card.addEventListener('click', () => openDetail(idx));
                grid.appendChild(card);
            });
        }

        // ============================================================
        // DETAIL OVERLAY
        // ============================================================
        function openDetail(index) {
            const job = jobsData[index];
            if (!job) return;
            const overlay = document.getElementById('detailOverlay');
            const body = document.getElementById('detailBody');
            const typeLabels = { central: '🇮🇳 Central Govt.', state: '🏜️ Rajasthan Govt.', private: '💼 Private' };
            const iconMap = { central: '🏛️', state: '🏜️', private: '💼' };
            const subColorMap = {
                'Administrative': '#4a6cf7', 'Banking': '#f7b731', 'Railway': '#e74c3c',
                'Defence': '#2ecc71', 'Teaching': '#9b59b6', 'Medical': '#e67e22',
                'PSU': '#1abc9c', 'Police': '#2c3e50', 'Revenue': '#27ae60',
                'Forest': '#27ae60', 'Technical': '#3498db', 'Judicial': '#8e44ad',
                'IT/Software': '#6c5ce7', 'Finance': '#00b894', 'Marketing': '#fd79a8',
                'HR': '#0984e3', 'Manufacturing': '#fdcb6e', 'Healthcare': '#e17055',
                'Education': '#6c5ce7', 'Hospitality': '#00cec9', 'Other': '#636e72'
            };
            body.innerHTML = `
                <div class="detail-icon">${iconMap[job.jobType] || '💼'}</div>
                <h2>${job.title || 'Untitled'}</h2>
                <span style="background:${subColorMap[job.subCat] || '#636e72'};color:#fff;padding:2px 14px;border-radius:20px;font-size:12px;font-weight:600;display:inline-block;margin-bottom:10px;">${job.subCat || 'Other'}</span>
                <div class="detail-section">
                    <p style="margin:4px 0;"><strong>🏢 Department:</strong> ${job.department || '-'}</p>
                    <p style="margin:4px 0;"><strong>📌 Post:</strong> ${job.post || '-'}</p>
                    <p style="margin:4px 0;"><strong>📂 Job Type:</strong> ${typeLabels[job.jobType] || job.jobType}</p>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin:10px 0;">
                    <p><strong>🎓 Eligibility:</strong> ${job.eligibility || '-'}</p>
                    <p><strong>📅 Age Limit:</strong> ${job.age || '-'}</p>
                    <p><strong>⏳ Last Date:</strong> ${job.lastDate || '-'}</p>
                    <p><strong>💼 Experience:</strong> ${job.experience || 'Freshers can apply'}</p>
                </div>
                ${job.description ? `<div class="detail-desc"><p><strong>📝 Description:</strong></p><div>${job.description}</div></div>` : ''}
                <div style="margin:12px 0;">
                    ${job.website ? `<p><strong>🌐 Official Website:</strong> <a href="${job.website}" target="_blank" style="color:var(--secondary-blue);text-decoration:underline;font-weight:600;">${job.website}</a></p>` : ''}
                    ${job.applyLink ? `<p><strong>📝 Apply Link:</strong> <a href="${job.applyLink}" target="_blank" style="color:var(--secondary-blue);text-decoration:underline;font-weight:600;">${job.applyLink}</a></p>` : ''}
                </div>
                <div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;">
                    <span class="detail-link secondary" onclick="closeDetail()">✕ Close</span>
                    ${job.applyLink ? `<a href="${job.applyLink}" target="_blank" class="detail-link"><i class="fas fa-external-link-alt"></i> Apply Now</a>` : ''}
                </div>
            `;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeDetail(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('detailOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, type = 'info') {
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        // ============================================================
        // URL PARAM SUPPORT — ?cat=central / ?cat=state / ?cat=private
        // ============================================================
        function getCategoryFromURL() {
            const params = new URLSearchParams(window.location.search);
            const cat = params.get('cat');
            if (cat && ['central', 'state', 'private'].includes(cat)) return cat;
            return null;
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            renderNav();
            // URL se category check karo
            const urlCat = getCategoryFromURL();
            if (urlCat) currentCategory = urlCat;
            updateJobsUI();
            console.log('✅ Dream Josh - Jobs Page Ready — सभी pages linked');
        });

        // Expose globally
        window.showJobsCategory = showJobsCategory;
        window.selectCategory = selectCategory;
        window.filterSubCategory = filterSubCategory;
        window.openDetail = openDetail;
        window.closeDetail = closeDetail;
        window.toggleDropdownMobile = toggleDropdownMobile;
        window.closeDropdownMobile = closeDropdownMobile;
        window.showToast = showToast;
    </script>

</body>
</html>
