<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Josh Translator • Devlys ⇄ Mangal</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --dj-orange:#ff8c1a;--dj-orange-light:#ffb347;--dj-orange-glow:#ffcf8a;
    --dj-green:#00c9b1;--text-dark:#1a2b40;--text-mid:#4a5b73;--text-dim:#7a8ba3;
  }
  body{
    font-family:'Segoe UI','Mangal','Noto Sans Devanagari',system-ui,sans-serif;
    background:#fff;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px 16px;color:var(--text-dark);
  }
  .container{width:100%;max-width:1200px}
  .brand{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:8px;flex-wrap:wrap}
  .brand-logo{
    display:flex;align-items:center;justify-content:center;width:52px;height:52px;
    border-radius:16px;background:linear-gradient(135deg,var(--dj-orange),var(--dj-green));
    font-size:1.7rem;box-shadow:0 8px 24px -6px rgba(255,140,26,.45);
  }
  .brand h1{
    font-size:2.1rem;font-weight:800;
    background:linear-gradient(90deg,#d96b00 10%,var(--dj-orange) 45%,var(--dj-green) 90%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .brand h1 .josh{font-style:italic;font-weight:900}
  .tagline{text-align:center;color:var(--text-mid);font-size:1rem;margin-bottom:18px}
  .tagline strong{color:#d96b00;font-weight:600}

  .dir-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
  .dir-btn{
    display:inline-flex;align-items:center;gap:8px;padding:10px 22px;
    font-size:.92rem;font-weight:700;font-family:inherit;border-radius:60px;cursor:pointer;
    background:#fff;color:var(--text-mid);border:1.5px solid #e6eaf2;
    transition:all .18s ease;box-shadow:0 4px 12px -6px rgba(20,40,70,.12);
  }
  .dir-btn:hover{border-color:var(--dj-orange-glow);color:#b85a00}
  .dir-btn.active{
    background:linear-gradient(135deg,var(--dj-orange-light),var(--dj-orange));
    color:#1a0f00;border-color:var(--dj-orange);
    box-shadow:0 8px 22px -8px rgba(255,140,26,.55);
  }
  .dir-btn .arrow{font-size:1.1rem}

  .card{
    background:#fff;border-radius:36px;border:1.5px solid #eef1f6;
    box-shadow:0 24px 60px -24px rgba(20,40,70,.18),0 6px 20px -10px rgba(20,40,70,.08);
    padding:30px 28px 26px;
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:780px){.grid{grid-template-columns:1fr;gap:18px}}

  .pane{display:flex;flex-direction:column;min-width:0}
  .pane-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px}
  .pane-title{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.15rem;color:var(--text-dark)}
  .pane-title .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .dot.legacy{background:var(--dj-orange);box-shadow:0 0 10px #ff8c1a66}
  .dot.unicode{background:var(--dj-green);box-shadow:0 0 10px #00c9b166}
  .pill{
    font-size:.72rem;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
    padding:4px 12px;border-radius:40px;background:#f4f6fb;color:var(--text-dim);border:1px solid #e6eaf2;
  }

  textarea{
    width:100%;min-height:260px;padding:20px;font-size:1.2rem;line-height:1.8;
    border-radius:22px;border:1.5px solid #dfe5ef;background:#fff;color:#142b3c;
    box-shadow:inset 0 2px 8px rgba(20,40,70,.03);resize:vertical;
    font-family:'Kruti Dev 010','KrutiDev010','Kruti Dev','DevLys 010','DevLys','Mangal','Noto Sans Devanagari',monospace;
    transition:border .2s,box-shadow .2s;caret-color:var(--dj-orange);
  }
  textarea::placeholder{color:#9aa8bd;font-size:1rem;font-family:'Mangal','Noto Sans Devanagari','Segoe UI',sans-serif}
  textarea:focus{
    outline:none;border-color:var(--dj-orange);
    box-shadow:0 0 0 4px rgba(255,140,26,.14),inset 0 2px 8px rgba(20,40,70,.03);
  }
  textarea.mangal-box{
    font-family:'Mangal','Noto Sans Devanagari','Segoe UI',sans-serif;
    border-color:#c9ece5;color:#0d3b32;
  }
  textarea.mangal-box:focus{
    border-color:var(--dj-green);
    box-shadow:0 0 0 4px rgba(0,201,177,.13),inset 0 2px 8px rgba(20,40,70,.03);
  }

  .actions{
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
    gap:14px;margin-top:28px;padding-top:24px;border-top:1px solid #eef1f6;
  }
  button{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    padding:12px 26px;font-size:1rem;font-weight:600;font-family:inherit;
    border-radius:60px;border:1.5px solid #e6eaf2;background:#fff;color:var(--text-mid);
    cursor:pointer;transition:all .18s ease;box-shadow:0 4px 12px -6px rgba(20,40,70,.12);
  }
  button:hover{
    border-color:var(--dj-orange-glow);background:#fffaf3;color:#b85a00;
    transform:translateY(-2px);box-shadow:0 10px 22px -10px rgba(255,140,26,.35);
  }
  button:active{transform:translateY(1px) scale(.985)}
  button.primary{
    background:linear-gradient(135deg,var(--dj-orange-light),var(--dj-orange));
    border:1px solid var(--dj-orange);color:#1a0f00;
    box-shadow:0 10px 26px -8px rgba(255,140,26,.55);font-size:1.05rem;padding:13px 34px;
  }
  button.primary:hover{
    background:linear-gradient(135deg,#ffc36b,#ff9a2e);color:#1a0f00;
    box-shadow:0 14px 32px -8px rgba(255,140,26,.7);transform:translateY(-2px);
  }
  .icon{font-size:1.15rem;line-height:1}

  .footer-badges{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:26px;padding-top:20px;border-top:1px solid #eef1f6}
  .badge{
    display:inline-flex;align-items:center;gap:7px;padding:7px 16px;font-size:.82rem;
    font-weight:500;border-radius:60px;background:#fbfcfe;border:1px solid #e9edf5;color:var(--text-mid);
  }
  .badge.green{background:#f0fdfa;border-color:#c9ece5;color:#0b7a6b}
  .badge.orange{background:#fffaf3;border-color:#ffe2c2;color:#b85a00}

  .toast{
    position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#fff;color:#0b7a6b;padding:13px 30px;border-radius:60px;border:1.5px solid #c9ece5;
    box-shadow:0 18px 40px -12px rgba(20,40,70,.18);font-weight:600;font-size:.95rem;z-index:1000;
    opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;display:flex;align-items:center;gap:10px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:500px){
    .brand h1{font-size:1.55rem}
    .brand-logo{width:44px;height:44px;font-size:1.4rem}
    .card{padding:20px 16px 18px;border-radius:28px}
    textarea{min-height:200px;padding:16px;font-size:1.05rem}
    button{padding:11px 20px;font-size:.92rem}
    button.primary{padding:12px 26px}
  }
</style>
</head>
<body>

<div class="container">
  <div class="brand">
    <div class="brand-logo">🚀</div>
    <h1>Dream <span class="josh">Josh</span> Translator</h1>
  </div>
  <div class="tagline">
    <strong>देवलिस</strong> (Kruti Dev) ⇄ <strong>मंगल</strong> (Unicode)
  </div>

  <div class="dir-bar">
    <button class="dir-btn active" id="dirD2M">देवलिस <span class="arrow">→</span> मंगल</button>
    <button class="dir-btn" id="dirM2D">मंगल <span class="arrow">→</span> देवलिस</button>
  </div>

  <div class="card">
    <div class="grid">
      <div class="pane">
        <div class="pane-header">
          <div class="pane-title"><span class="dot legacy"></span><span id="leftTitle">Devlys / Kruti Dev</span></div>
          <span class="pill" id="leftPill">LEGACY</span>
        </div>
        <textarea id="leftBox" spellcheck="false"
          placeholder="यहाँ देवलिस / कृतिदेव टेक्स्ट लिखें या पेस्ट करें..."></textarea>
      </div>

      <div class="pane">
        <div class="pane-header">
          <div class="pane-title"><span class="dot unicode"></span><span id="rightTitle">Mangal (Unicode)</span></div>
          <span class="pill" id="rightPill">हिंदी</span>
        </div>
        <textarea id="rightBox" class="mangal-box" spellcheck="false"
          placeholder="यहाँ यूनिकोड (मंगल) टेक्स्ट दिखेगा / टाइप करें..."></textarea>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="convertBtn"><span class="icon">⚡</span> कन्वर्ट करें</button>
      <button id="clearBtn"><span class="icon">🗑️</span> साफ़ करें</button>
      <button id="copyBtn"><span class="icon">📋</span> कॉपी करें</button>
      <button id="swapBtn"><span class="icon">🔁</span> बदलें (Swap)</button>
    </div>

    <div class="footer-badges">
      <span class="badge green">✅ देवलिस ⇄ मंगल</span>
      <span class="badge">🔤 मानक हिंदी यूनिकोड</span>
      <span class="badge orange">⚡ Dream Josh Engine</span>
    </div>
  </div>
</div>

<div id="toast" class="toast"><span>✅</span> <span id="toastMsg">कॉपी हो गया!</span></div>

<script>
(function(){
  "use strict";

  /* ================================================================
     Devlys (Kruti Dev) → Unicode (Mangal)
     IMPORTANT: har key unique hai. Longest match pehle try hota hai.
     ================================================================ */
  var D2U = {
    // Independent vowels
    "vk":"आ","v":"अ","b":"इ","bZ":"ई","m":"उ","Å":"ऊ","_,":"ऋ",
    "M":"ए","sv":"ऐ","vks":"ओ","vkS":"औ",
    // Consonants
    "d":"क","x":"ग","?k":"घ","³":"ङ",
    "p":"च","N":"छ","t":"ज",">k":"झ","¥":"ञ",
    "V":"ट","B":"ठ","M+":"ड","<":"ढ",".k":"ण",
    "r":"त","Fk":"थ","n":"द","/k":"ध","u":"न",
    "i":"प","Q":"फ","c":"ब","Hk":"भ","e":"म",
    ";":"य","j":"र","y":"ल","o":"व",
    "k":"श",'"k':"ष","l":"स","g":"ह",
    "{k":"क्ष","=k":"त्र","K":"ज्ञ",
    // Half consonants (halant forms)
    "D":"क्","X":"ग्","?":"घ्","P":"च्","T":"ट्","M+":"ड्",
    "R":"त्","F":"थ्","N":"द्","U":"न्","I":"प्","C":"ब्",
    "E":"म्","J":"र्","Y":"ल्","O":"व्","K2":"श्",
    // Matras
    "k2":"ा","f":"ि","h":"ी","q":"ु","w":"ू","`":"ृ",
    "s":"े","S":"ै","ks":"ो","kS":"ौ","a":"ं","¡":"ँ",
    "%":"ः","~":"्","z":"्र","Z":"र्","ƒ":"ऱ्",
    // Digits
    "0":"०","1":"१","2":"२","3":"३","4":"४",
    "5":"५","6":"६","7":"७","8":"८","9":"९",
    // Punctuation / common
    "A":"।","&":"-","=":"=","+":"+","*":"*",
    "/":"/","\\":"\\","|":"|","-":"-",
    "[":"[","]":"]","(":"(",")":")",
    ":":":",";":";",",":",",".": ".",
    "?":"?","!":"!","@":"@","#":"#","$":"$",
    "^":"^","_":"_","{":"{","}":"}","~":"~",
    "'":"'",'"':'"'," ":" ",
    // Common words (longest first)
    "vkSj":"और","vkSjr":"औरत","ysfdu":"लेकिन","fd":"कि",
    "dk":"का","ds":"के","dh":"की","dks":"को","ls":"से",
    "esa":"में","ij":"पर","tgka":"जहाँ","og":"वह",";g":"यह",
    "gS":"है","gSa":"हैं","Fkk":"था","Fks":"थे","Fkh":"थी",
    "Hkh":"भी","vPNk":"अच्छा","cM+k":"बड़ा","NksVk":"छोटा",
    "lqUnj":"सुंदर","fganh":"हिंदी","Hkk\"kk":"भाषा",
    "lHkh":"सभी","uke":"नाम","dke":"काम","ns'k":"देश",
    "f'k{kk":"शिक्षा","Kku":"ज्ञान","fo|k":"विद्या",
    "iqLrd":"पुस्तक","ys[kd":"लेखक","dk;Z":"कार्य",
    "iz'u":"प्रश्न","mRrj":"उत्तर","lgk;rk":"सहायता",
    "Lokxr":"स्वागत","èkU;okn":"धन्यवाद","fnu":"दिन",
    "jkr":"रात","le;":"समय","vki":"आप","vkidk":"आपका",
    "vkidh":"आपकी","jkTk":"राज","y[kuÅ":"लखनऊ","vktexZ":"आजमगढ़"
  };

  /* ================================================================
     Build reverse map Unicode → Devlys
     Manual overrides ensure clean Devlys output
     ================================================================ */
  var U2D = {};

  // Manual reverse pairs (canonical Devlys keys)
  var manual = {
    "अ":"v","आ":"vk","इ":"b","ई":"bZ","उ":"m","ऊ":"Å","ऋ":"_,",
    "ए":"M","ऐ":"sv","ओ":"vks","औ":"vkS",
    "क":"d","ख":"[k","ग":"x","घ":"?k","ङ":"³",
    "च":"p","छ":"N","ज":"t","झ":">k","ञ":"¥",
    "ट":"V","ठ":"B","ड":"M+","ढ":"<","ण":".k",
    "त":"r","थ":"Fk","द":"n","ध":"/k","न":"u",
    "प":"i","फ":"Q","ब":"c","भ":"Hk","म":"e",
    "य":";","र":"j","ल":"y","व":"o",
    "श":"k","ष":'"k',"स":"l","ह":"g",
    "क्ष":"{k","त्र":"=k","ज्ञ":"K",
    "ा":"k","ि":"f","ी":"h","ु":"q","ू":"w","ृ":"`",
    "े":"s","ै":"S","ो":"ks","ौ":"kS","ं":"a","ँ":"¡",
    "ः":"%","्":"~","्र":"z","र्":"Z",
    "०":"0","१":"1","२":"2","३":"3","४":"4",
    "५":"5","६":"6","७":"7","८":"8","९":"9",
    "।":"A"," ":" "
  };
  for (var k in manual) if (manual.hasOwnProperty(k)) U2D[k] = manual[k];

  /* ================================================================
     Prepare sorted key lists (longest first)
     ================================================================ */
  function sortedKeys(obj){
    return Object.keys(obj).sort(function(a,b){ return b.length - a.length; });
  }
  var D2U_keys = sortedKeys(D2U);
  var U2D_keys = sortedKeys(U2D);

  /* ================================================================
     Conversion functions
     ================================================================ */
  function devlysToUnicode(text){
    if (!text) return "";
    var out = "", i = 0, len = text.length;
    while (i < len){
      var matched = false;
      for (var j = 0; j < D2U_keys.length; j++){
        var key = D2U_keys[j];
        if (i + key.length <= len && text.substr(i, key.length) === key){
          out += D2U[key];
          i += key.length;
          matched = true;
          break;
        }
      }
      if (!matched){ out += text.charAt(i); i++; }
    }
    return out;
  }

  function unicodeToDevlys(text){
    if (!text) return "";
    var out = "", i = 0, len = text.length;
    while (i < len){
      var matched = false;
      for (var j = 0; j < U2D_keys.length; j++){
        var key = U2D_keys[j];
        if (i + key.length <= len && text.substr(i, key.length) === key){
          out += U2D[key];
          i += key.length;
          matched = true;
          break;
        }
      }
      if (!matched){ out += text.charAt(i); i++; }
    }
    return out;
  }

  /* ================================================================
     DOM
     ================================================================ */
  var leftBox    = document.getElementById("leftBox");
  var rightBox   = document.getElementById("rightBox");
  var leftTitle  = document.getElementById("leftTitle");
  var rightTitle = document.getElementById("rightTitle");
  var leftPill   = document.getElementById("leftPill");
  var rightPill  = document.getElementById("rightPill");
  var convertBtn = document.getElementById("convertBtn");
  var clearBtn   = document.getElementById("clearBtn");
  var copyBtn    = document.getElementById("copyBtn");
  var swapBtn    = document.getElementById("swapBtn");
  var dirD2M     = document.getElementById("dirD2M");
  var dirM2D     = document.getElementById("dirM2D");
  var toast      = document.getElementById("toast");
  var toastMsg   = document.getElementById("toastMsg");

  var direction = "D2M";
  var toastTimer = null;

  function showToast(msg){
    toastMsg.textContent = msg;
    toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 1800);
  }

  function setDirection(dir){
    direction = dir;
    if (dir === "D2M"){
      dirD2M.classList.add("active");
      dirM2D.classList.remove("active");
      leftTitle.textContent  = "Devlys / Kruti Dev";
      leftPill.textContent   = "LEGACY";
      rightTitle.textContent = "Mangal (Unicode)";
      rightPill.textContent  = "हिंदी";
      leftBox.className  = "";
      rightBox.className = "mangal-box";
    } else {
      dirM2D.classList.add("active");
      dirD2M.classList.remove("active");
      leftTitle.textContent  = "Mangal (Unicode)";
      leftPill.textContent   = "हिंदी";
      rightTitle.textContent = "Devlys / Kruti Dev";
      rightPill.textContent  = "LEGACY";
      leftBox.className  = "mangal-box";
      rightBox.className = "";
    }
  }

  /* Convert LEFT → RIGHT (main action) */
  function convertLeftToRight(){
    var src = leftBox.value;
    rightBox.value = (direction === "D2M")
      ? devlysToUnicode(src)
      : unicodeToDevlys(src);
  }

  /* Convert RIGHT → LEFT (reverse, for typing in right box) */
  function convertRightToLeft(){
    var src = rightBox.value;
    leftBox.value = (direction === "D2M")
      ? unicodeToDevlys(src)     // right is Mangal, so Mangal → Devlys
      : devlysToUnicode(src);    // right is Devlys, so Devlys → Mangal
  }

  /* ================================================================
     Event listeners
     ================================================================ */
  var leftTimer = null;
  leftBox.addEventListener("input", function(){
    if (leftTimer) clearTimeout(leftTimer);
    leftTimer = setTimeout(convertLeftToRight, 200);
  });

  var rightTimer = null;
  rightBox.addEventListener("input", function(){
    if (rightTimer) clearTimeout(rightTimer);
    rightTimer = setTimeout(convertRightToLeft, 200);
  });

  convertBtn.addEventListener("click", function(){
    convertLeftToRight();
    showToast("कन्वर्ट हो गया! ⚡");
  });

  clearBtn.addEventListener("click", function(){
    leftBox.value = "";
    rightBox.value = "";
    leftBox.focus();
    showToast("साफ़ हो गया!");
  });

  copyBtn.addEventListener("click", function(){
    var out = rightBox.value;
    if (!out.trim()){ showToast("पहले कुछ कन्वर्ट करें!"); return; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(out).then(function(){
        showToast("कॉपी हो गया!");
      }).catch(function(){
        rightBox.select(); document.execCommand("copy");
        showToast("कॉपी हो गया!");
      });
    } else {
      rightBox.select(); document.execCommand("copy");
      showToast("कॉपी हो गया!");
    }
  });

  swapBtn.addEventListener("click", function(){
    var l = leftBox.value;
    var r = rightBox.value;
    leftBox.value = r;
    rightBox.value = l;
    setDirection(direction === "D2M" ? "M2D" : "D2M");
    showToast("दिशा और टेक्स्ट बदल गए!");
  });

  dirD2M.addEventListener("click", function(){ setDirection("D2M"); convertLeftToRight(); });
  dirM2D.addEventListener("click", function(){ setDirection("M2D"); convertLeftToRight(); });

  /* Ctrl+Enter */
  leftBox.addEventListener("keydown", function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){
      e.preventDefault(); convertLeftToRight();
      showToast("कन्वर्ट हो गया! ⚡");
    }
  });
  rightBox.addEventListener("keydown", function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){
      e.preventDefault(); convertRightToLeft();
      showToast("कन्वर्ट हो गया! ⚡");
    }
  });

  /* Init */
  setDirection("D2M");
})();
</script>
</body>
</html>
